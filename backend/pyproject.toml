[project]
name = "gman-api"
version = "0.2.0"
description = "GMan inventory API: inventory, config history, releases, telemetry and alert metrics"
requires-python = ">=3.12"
dependencies = [
    "fastapi (==0.143.0)",
    "uvicorn (==0.54.0)",
    "sqlalchemy (==2.1.4)",
    "alembic (==1.20.0)",
    "psycopg[binary] (==3.3.6)",
    "httpx (==0.28.1)",
    "cryptography (==50.0.2)",
    "pydantic-settings (==2.16.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
