server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ { proxy_pass http://api:8000; }
    location / { try_files $uri /index.html; }
}
