server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    # Same limit for inventory snapshots as in production (deploy/nginx/gman.conf).
    location = /api/inventory { client_max_body_size 20m; proxy_pass http://api:8000; }
    location /api/ { proxy_pass http://api:8000; }
    # Grafana is served from /grafana/ (GF_SERVER_SERVE_FROM_SUB_PATH), so dashboard links work on any host name.
    # Resolved per request: the portal starts even while Grafana is still starting. Its own add_header keeps the
    # portal's strict CSP (inherited otherwise) from breaking Grafana's inline scripts.
    location /grafana/ {
        add_header X-Content-Type-Options nosniff always;
        resolver 127.0.0.11 valid=10s;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
    location / { try_files $uri /index.html; }
}
