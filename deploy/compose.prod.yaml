# Production override for a single GMan server:
#   docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.prod.yaml up --build -d
# Published: 80/443 (nginx: portal, API, Grafana under /grafana/) and 4317 (OTLP gRPC, mTLS).
# Prometheus and Alertmanager stay on 127.0.0.1:9090/9093; PostgreSQL and Grafana are not published.
# Alert receivers: GMAN_ALERT_* in .env (see deploy/alerts/alertmanager.sh).
# Requires in .env: GMAN_PUBLIC_HOST (DNS name in the portal certificate).
# Certificates (deploy/pki/issue.sh) are read from GMAN_TLS_DIR (default deploy/pki/out):
#   portal.pem, portal-key.pem, gateway.pem, gateway-key.pem, ca.pem. Never put ca-key.pem there
#   on the server. Requires Docker Compose >= 2.24.4 (!override/!reset tags).
x-logging: &logging
  driver: json-file
  options: {max-size: 20m, max-file: "5"}

services:
  db:
    logging: *logging
  api:
    environment:
      GMAN_GRAFANA_URL: https://${GMAN_PUBLIC_HOST:?Set GMAN_PUBLIC_HOST}/grafana
    logging: *logging
  portal:
    ports: !override
      - "${GMAN_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${GMAN_BIND_ADDRESS:-0.0.0.0}:443:443"
    volumes:
      - ./nginx/gman.conf:/etc/nginx/conf.d/default.conf:ro
      - ${GMAN_TLS_DIR:-./pki/out}/portal.pem:/etc/nginx/tls/portal.pem:ro
      - ${GMAN_TLS_DIR:-./pki/out}/portal-key.pem:/etc/nginx/tls/portal-key.pem:ro
    depends_on:
      # nginx resolves upstream names at startup.
      grafana: {condition: service_healthy}
    logging: *logging
  otel:
    volumes: !override
      - ./otel-gateway.prod.yaml:/etc/otelcol/config.yaml:ro
      - ${GMAN_TLS_DIR:-./pki/out}/ca.pem:/etc/otelcol/tls/ca.pem:ro
      - ${GMAN_TLS_DIR:-./pki/out}/gateway.pem:/etc/otelcol/tls/gateway.pem:ro
      # Must be readable by uid 10001 inside the container (see README).
      - ${GMAN_TLS_DIR:-./pki/out}/gateway-key.pem:/etc/otelcol/tls/gateway-key.pem:ro
    # Only gRPC is published: node Collectors use otlp_grpc. 4318 stays internal.
    ports: !override
      - "${GMAN_OTLP_BIND_ADDRESS:-0.0.0.0}:4317:4317"
    logging: *logging
  prometheus:
    environment:
      GMAN_PORTAL_URL: https://${GMAN_PUBLIC_HOST:?Set GMAN_PUBLIC_HOST}
    logging: *logging
  alertmanager:
    logging: *logging
  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://${GMAN_PUBLIC_HOST:?Set GMAN_PUBLIC_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/grafana/api/health || wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
    logging: *logging
  backup:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/gman-backup"]
    environment:
      PGHOST: db
      PGUSER: gman
      PGDATABASE: gman
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_KEEP: ${GMAN_BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${GMAN_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup/pg_backup.sh:/usr/local/bin/gman-backup:ro
      - ${GMAN_BACKUP_DIR:-./backups}:/backups
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/gman-backup", "--check"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10m
    restart: unless-stopped
    logging: *logging
