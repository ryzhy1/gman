# Production override for a single GMan server:
#   docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.prod.yaml up --build -d
# Published: 80/443 (nginx: portal, API, Grafana under /grafana/) and 4317 (nginx: OTLP gRPC, mTLS).
# Prometheus and Alertmanager stay on 127.0.0.1:9090/9093; PostgreSQL, Grafana and the OTel gateway
# are not published.
# Alert receivers: GMAN_ALERT_* in .env (see deploy/alerts/alertmanager.sh).
# Requires in .env: GMAN_PUBLIC_HOST (DNS name in the portal certificate).
# Certificates (deploy/pki/issue.sh) are read from GMAN_TLS_DIR (default deploy/pki/out):
#   portal.pem, portal-key.pem, gateway.pem, gateway-key.pem, ca.pem, crl.pem (the API also gets the four public
#   files, no keys, to export their expiry for the GManTls* alerts). Never put ca-key.pem there
#   on the server. Requires Docker Compose >= 2.24.4 (!override/!reset tags).
x-logging: &logging
  driver: json-file
  options: {max-size: 20m, max-file: "5"}

services:
  db:
    logging: *logging
  api:
    environment:
      GMAN_GRAFANA_URL: https://${GMAN_PUBLIC_HOST:?Set GMAN_PUBLIC_HOST}/grafana
      # Expiry of nginx's certificates and CRL on /metrics (GManTls* alerts): an expired crl.pem makes nginx
      # reject every OTLP client. Only public files are mounted (no keys); they must be world-readable (0644),
      # the API runs as 65534.
      GMAN_TLS_WATCH_FILES: ${GMAN_TLS_WATCH_FILES:-/etc/gman/tls/portal.pem,/etc/gman/tls/gateway.pem,/etc/gman/tls/ca.pem,/etc/gman/tls/crl.pem}
    # Same single-file mounts as the portal's: replaced in place (cp), they are seen without a restart.
    volumes:
      - ${GMAN_TLS_DIR:-./pki/out}/portal.pem:/etc/gman/tls/portal.pem:ro
      - ${GMAN_TLS_DIR:-./pki/out}/gateway.pem:/etc/gman/tls/gateway.pem:ro
      - ${GMAN_TLS_DIR:-./pki/out}/ca.pem:/etc/gman/tls/ca.pem:ro
      - ${GMAN_TLS_DIR:-./pki/out}/crl.pem:/etc/gman/tls/crl.pem:ro
    logging: *logging
  portal:
    # nginx also terminates OTLP mTLS on 4317 (client CA + CRL) and passes the certificate identity to the
    # gateway, which binds host.id to it (deploy/otel-gateway.prod.yaml).
    ports: !override
      - "${GMAN_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${GMAN_BIND_ADDRESS:-0.0.0.0}:443:443"
      - "${GMAN_OTLP_BIND_ADDRESS:-0.0.0.0}:4317:4317"
    # Single-file bind mounts pin the inode: replace these files in place (cp, not mv), then
    # `docker compose ... exec portal nginx -s reload`.
    volumes:
      - ./nginx/gman.conf:/etc/nginx/conf.d/default.conf:ro
      - ${GMAN_TLS_DIR:-./pki/out}/portal.pem:/etc/nginx/tls/portal.pem:ro
      - ${GMAN_TLS_DIR:-./pki/out}/portal-key.pem:/etc/nginx/tls/portal-key.pem:ro
      - ${GMAN_TLS_DIR:-./pki/out}/gateway.pem:/etc/nginx/tls/gateway.pem:ro
      - ${GMAN_TLS_DIR:-./pki/out}/gateway-key.pem:/etc/nginx/tls/gateway-key.pem:ro
      - ${GMAN_TLS_DIR:-./pki/out}/ca.pem:/etc/nginx/tls/ca.pem:ro
      - ${GMAN_TLS_DIR:-./pki/out}/crl.pem:/etc/nginx/tls/crl.pem:ro
    depends_on:
      # nginx resolves upstream names at startup.
      grafana: {condition: service_healthy}
      otel: {condition: service_started}
    logging: *logging
  otel:
    command: ["--config=/etc/otelcol/gateway.prod.yaml"]
    # Reachable only from the Compose network (nginx); the data of a sender without nginx's identity
    # headers is dropped by the gateway.
    ports: !reset []
    logging: *logging
  prometheus:
    environment:
      GMAN_PORTAL_URL: https://${GMAN_PUBLIC_HOST:?Set GMAN_PUBLIC_HOST}
    logging: *logging
  alertmanager:
    # Alertmanager has no authentication (anyone reaching it can silence alerts), so it is not proxied by nginx.
    # Links in notifications therefore use GMAN_ALERTMANAGER_URL (default http://127.0.0.1:9093): open them
    # through an SSH tunnel to the server, or set the variable to an address you publish with access control.
    logging: *logging
  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://${GMAN_PUBLIC_HOST:?Set GMAN_PUBLIC_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/grafana/api/health || wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
    logging: *logging
  backup:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/gman-backup"]
    environment:
      PGHOST: db
      PGUSER: gman
      PGDATABASE: gman
      PGPASSWORD: ${POSTGRES_PASSWORD:-gman}
      BACKUP_KEEP: ${GMAN_BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${GMAN_BACKUP_INTERVAL_SECONDS:-86400}
      # Off-site copy after each dump, archive path as $1 (README, «Резервное копирование»); empty = off.
      # The command runs in this container: mount the target (e.g. a network share) below.
      BACKUP_UPLOAD_CMD: ${GMAN_BACKUP_UPLOAD_CMD:-}
      # Restore the newest dump into a temporary database every N days (0 = off).
      BACKUP_RESTORE_CHECK_DAYS: ${GMAN_BACKUP_RESTORE_CHECK_DAYS:-7}
    volumes:
      - ./backup/pg_backup.sh:/usr/local/bin/gman-backup:ro
      - ${GMAN_BACKUP_DIR:-./backups}:/backups
      # Off-site target for BACKUP_UPLOAD_CMD='cp "$1" /offsite/' (a network share mounted on the host).
      - ${GMAN_BACKUP_OFFSITE_DIR:-./backups-offsite}:/offsite
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/gman-backup", "--check"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10m
    restart: unless-stopped
    logging: *logging
