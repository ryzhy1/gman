apiVersion: v1
kind: ServiceAccount
metadata:
  name: gman-inventory
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gman-inventory
rules:
  - apiGroups: ['']
    resources: ['pods', 'nodes']
    verbs: ['get', 'list']
  # collect.py --watch: watch API for pods; pod and node Events (reason/count/time only, messages are not sent).
  # Node Events live in the namespace "default": a ClusterRole bound cluster-wide (below) covers it; a namespaced
  # Role would not see them.
  - apiGroups: ['']
    resources: ['pods', 'events']
    verbs: ['list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gman-inventory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gman-inventory
subjects:
  - kind: ServiceAccount
    name: gman-inventory
    namespace: default
