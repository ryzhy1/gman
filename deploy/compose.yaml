name: gman
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gman
      POSTGRES_USER: gman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gman"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://gman:${POSTGRES_PASSWORD}@db/gman
      GMAN_READ_TOKEN: ${GMAN_READ_TOKEN:?Set GMAN_READ_TOKEN}
      GMAN_ADMIN_TOKEN: ${GMAN_ADMIN_TOKEN:?Set GMAN_ADMIN_TOKEN}
      GMAN_CI_TOKEN: ${GMAN_CI_TOKEN:?Set GMAN_CI_TOKEN}
      GMAN_AGENT_TOKENS: ${GMAN_AGENT_TOKENS:?Set GMAN_AGENT_TOKENS}
      PROMETHEUS_URL: http://prometheus:9090
      # Address of Grafana as the browser sees it; used for default dashboard links.
      GMAN_GRAFANA_URL: ${GMAN_GRAFANA_URL:-http://127.0.0.1:3000}
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  portal:
    build: ../frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    restart: unless-stopped
  otel:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-gateway.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./prometheus.yaml:/etc/prometheus/prometheus.yml:ro", "prometheus:/prometheus"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped
volumes:
  postgres:
  prometheus:
  grafana:
