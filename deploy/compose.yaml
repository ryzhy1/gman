name: gman
# The whole GMan server: `docker compose up --build -d` from the project root (compose.yaml includes this file).
# Every configuration file is built into the images, so nothing besides Docker is needed on the server and no
# .env is required: all variables below have working defaults; set them in .env next to compose.yaml to override.
# The portal and API have no sign-in: publish them only on a network you trust.
# Published ports (host side): GMAN_PORT (portal, 8080), GMAN_OTLP_PORT (4317), GMAN_OTLP_HTTP_PORT (4318);
# on 127.0.0.1 only: GMAN_PROMETHEUS_PORT (9090), GMAN_ALERTMANAGER_PORT (9093), GMAN_GRAFANA_PORT (3000).
# GMAN_METRICS_INTERVAL (seconds, default 5): metrics collection, Prometheus scraping and rules, portal refresh.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gman
      POSTGRES_USER: gman
      # The database is reachable only from the Compose network.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gman}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gman"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    # Dependencies are downloaded while building (Poetry, npm): host network, so that a Docker bridge without
    # working DNS (firewall, VPN, rootless Docker) does not break `docker compose up --build`.
    build: {context: ../backend, network: host}
    environment:
      DATABASE_URL: postgresql+psycopg://gman:${POSTGRES_PASSWORD:-gman}@db/gman
      PROMETHEUS_URL: http://prometheus:9090
      # Address of Grafana as the browser sees it; the portal proxies it under /grafana/.
      GMAN_GRAFANA_URL: ${GMAN_GRAFANA_URL:-/grafana}
      # Splunk search links on the service card; empty URL hides them (README, «Splunk»).
      GMAN_SPLUNK_URL: ${GMAN_SPLUNK_URL:-}
      GMAN_SPLUNK_SEARCH: ${GMAN_SPLUNK_SEARCH:-}
      GMAN_SPLUNK_INDEXES: ${GMAN_SPLUNK_INDEXES:-}
      # Active alerts for the portal's alerts page.
      ALERTMANAGER_URL: http://alertmanager:9093
      # The portal refreshes at the metrics pace.
      GMAN_METRICS_INTERVAL: ${GMAN_METRICS_INTERVAL:-5}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  portal:
    build: {context: ../frontend, network: host}
    # Portal, API (/api/) and Grafana (/grafana/). Remote agents send inventory to http://<server>:<GMAN_PORT>.
    ports: ["${GMAN_BIND_ADDRESS:-0.0.0.0}:${GMAN_PORT:-8080}:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  # Inventory of this server's own Docker containers. Other hosts run the same agent with GMAN_URL pointing here.
  agent:
    build: ../agent
    command: ["--runtime", "docker", "--source-id", "${GMAN_SOURCE_ID:-gman-server}", "--send", "--watch"]
    environment:
      GMAN_URL: http://api:8000
      # Address shown with the services of this host; by default the container's own address would be shown.
      GMAN_HOST_IP: ${GMAN_HOST_IP:-}
    # Host PID and UTS namespaces: GPU processes are matched to containers by host PID, and the host name is reported.
    pid: host
    uts: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
      - agent:/var/lib/gman-agent
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  # Host and container metrics of this server, sent to the gateway below under the agent's source ID.
  node-otel:
    build: {context: ., dockerfile: images/otel.Dockerfile}
    command: ["--config=/etc/otelcol/node.yaml"]
    environment:
      GMAN_HOST_ID: ${GMAN_SOURCE_ID:-gman-server}
      GMAN_METRICS_INTERVAL: ${GMAN_METRICS_INTERVAL:-5}
      # vLLM/Triton ports published on this host (otel-node.yaml, prometheus/llm), reached through the host gateway.
      GMAN_INFERENCE_HOST: host.docker.internal
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Root for the Docker socket; everything from the host is mounted read-only.
    user: "0:0"
    volumes:
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [otel]
    restart: unless-stopped
  otel:
    build: {context: ., dockerfile: images/otel.Dockerfile}
    # OTLP from the Collectors of other hosts (deploy/otel-agent.example.yaml). Plain OTLP without TLS: for
    # untrusted networks use the production override (mTLS through nginx).
    ports: ["${GMAN_OTLP_BIND_ADDRESS:-0.0.0.0}:${GMAN_OTLP_PORT:-4317}:4317",
            "${GMAN_OTLP_BIND_ADDRESS:-0.0.0.0}:${GMAN_OTLP_HTTP_PORT:-4318}:4318"]
    # The collector image is distroless (no shell/wget): no in-container healthcheck.
    # Liveness is visible in Prometheus as up{job="otel"}.
    restart: unless-stopped
  prometheus:
    build: {context: ., dockerfile: images/prometheus.Dockerfile}
    environment:
      # Browser-facing portal address for runbook links in alert annotations.
      GMAN_PORTAL_URL: ${GMAN_PORTAL_URL:-http://127.0.0.1:${GMAN_PORT:-8080}}
      GMAN_METRICS_INTERVAL: ${GMAN_METRICS_INTERVAL:-5}
    volumes: ["prometheus:/prometheus"]
    command: ["--config.file=/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d",
              "--enable-feature=expand-external-labels"]
    ports: ["127.0.0.1:${GMAN_PROMETHEUS_PORT:-9090}:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  alertmanager:
    build: {context: ., dockerfile: images/alertmanager.Dockerfile}
    environment:
      GMAN_ALERT_WEBHOOK_URL: ${GMAN_ALERT_WEBHOOK_URL:-}
      # Dead man's switch: ping URL of an external check for GManWatchdog (README, «Внешний мониторинг»).
      GMAN_ALERT_HEARTBEAT_URL: ${GMAN_ALERT_HEARTBEAT_URL:-}
      GMAN_ALERT_EMAIL_TO: ${GMAN_ALERT_EMAIL_TO:-}
      GMAN_ALERT_EMAIL_FROM: ${GMAN_ALERT_EMAIL_FROM:-}
      GMAN_ALERT_SMTP_SMARTHOST: ${GMAN_ALERT_SMTP_SMARTHOST:-}
      GMAN_ALERT_SMTP_USERNAME: ${GMAN_ALERT_SMTP_USERNAME:-}
      GMAN_ALERT_SMTP_PASSWORD: ${GMAN_ALERT_SMTP_PASSWORD:-}
      GMAN_ALERT_SMTP_REQUIRE_TLS: ${GMAN_ALERT_SMTP_REQUIRE_TLS:-true}
      GMAN_ALERTMANAGER_URL: ${GMAN_ALERTMANAGER_URL:-http://127.0.0.1:${GMAN_ALERTMANAGER_PORT:-9093}}
    volumes: ["alertmanager:/alertmanager"]
    ports: ["127.0.0.1:${GMAN_ALERTMANAGER_PORT:-9093}:9093"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  grafana:
    build: {context: ., dockerfile: images/grafana.Dockerfile}
    environment:
      # Served by the portal under /grafana/; dashboards open without sign-in (read-only viewer).
      GF_SERVER_ROOT_URL: ${GMAN_GRAFANA_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GMAN_METRICS_INTERVAL: ${GMAN_METRICS_INTERVAL:-5}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["grafana:/var/lib/grafana"]
    ports: ["127.0.0.1:${GMAN_GRAFANA_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on: [prometheus]
    restart: unless-stopped
volumes:
  postgres:
  prometheus:
  alertmanager:
  grafana:
  agent:
