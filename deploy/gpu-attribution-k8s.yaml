# Node-local GPU agent for Kubernetes: which pod holds which GPU process (PID -> cgroup -> container -> pod).
# The cluster inventory agent (--runtime kubernetes) may run anywhere via kubectl and cannot see node PIDs;
# this DaemonSet runs gman-agent.pyz --runtime kubernetes-node on every GPU node in the host PID namespace.
# Each node is its own GMan source "<cluster>.<node>" without instances: pods stay with the cluster source.
#
# Before applying (namespace gman-gpu):
#   kubectl create namespace gman-gpu
#   python3 agent/scripts/build_pyz.py   # -> agent/dist/gman-agent.pyz, the agent as one file
#   kubectl -n gman-gpu create configmap gman-agent --from-file=gman-agent.pyz=agent/dist/gman-agent.pyz
# Set GMAN_URL and GMAN_CLUSTER (the cluster agent's --source-id) below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gman-gpu-agent
  namespace: gman-gpu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gman-gpu-agent
rules:
  # Pods of its own node (field selector spec.nodeName) to map container IDs to pods. No Secrets, no exec.
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gman-gpu-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gman-gpu-agent
subjects:
  - kind: ServiceAccount
    name: gman-gpu-agent
    namespace: gman-gpu
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gman-gpu-agent
  namespace: gman-gpu
spec:
  selector:
    matchLabels: {app: gman-gpu-agent}
  template:
    metadata:
      labels: {app: gman-gpu-agent}
    spec:
      serviceAccountName: gman-gpu-agent
      # nvidia-smi reports PIDs of the caller's PID namespace, and /proc/<pid>/cgroup is read for those PIDs:
      # both need the node's PID namespace. Requires the "privileged" Pod Security level for this namespace.
      hostPID: true
      # Label set by NVIDIA GPU feature discovery (GPU Operator); replace with your GPU node selector.
      nodeSelector: {nvidia.com/gpu.present: 'true'}
      tolerations: [{operator: Exists}]
      # The NVIDIA container runtime injects nvidia-smi and the driver libraries (RuntimeClass created by the
      # GPU Operator). Remove the line if nvidia is the default containerd runtime on GPU nodes.
      runtimeClassName: nvidia
      containers:
        - name: agent
          image: python:3.12-slim
          command: ['sh', '-c']
          # One snapshot a minute; a failed run is not sent and the loop continues.
          args:
            - >-
              while true; do
              python3 -I /agent/gman-agent.pyz --runtime kubernetes-node --cluster "$GMAN_CLUSTER" --node "$NODE_NAME"
              --source-id "$GMAN_CLUSTER.$NODE_NAME" --send;
              sleep 60; done
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: GMAN_CLUSTER
              value: cluster-01  # Same as the cluster inventory agent's --source-id.
            - name: GMAN_URL
              value: http://gman.example:8080  # Replace with the portal/API address.
            # Spool of unsent snapshots and the run lock; the root filesystem is read-only. emptyDir on purpose:
            # the API keeps only the latest snapshot of a node source (no instances, so no history), so snapshots
            # lost with a pod restart carry nothing the next snapshot a minute later does not.
            - name: GMAN_AGENT_STATE_DIR
              value: /var/lib/gman-agent
            # Expose the node's GPUs for nvidia-smi (utility only) without requesting nvidia.com/gpu,
            # as DCGM Exporter does: the agent does not take a GPU away from workloads.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            # /proc/<pid>/cgroup is world-readable: no capabilities are needed. If nvidia-smi lists no
            # processes on your driver as non-root, run as root but keep capabilities dropped.
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: agent, mountPath: /agent, readOnly: true}
            - {name: state, mountPath: /var/lib/gman-agent}
      volumes:
        - name: state
          emptyDir: {sizeLimit: 64Mi}
        - name: agent
          configMap: {name: gman-agent}
