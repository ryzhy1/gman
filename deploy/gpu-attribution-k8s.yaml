# Node-local GPU agent for Kubernetes: which pod holds which GPU process (PID -> cgroup -> container -> pod).
# The cluster inventory agent (--runtime kubernetes) may run anywhere via kubectl and cannot see node PIDs;
# this DaemonSet runs agent/collect.py --runtime kubernetes-node on every GPU node in the host PID namespace.
# Each node is its own GMan source "<cluster>.<node>" without instances: pods stay with the cluster source.
#
# Identity: each pod authenticates with its own bound service account token (projected volume, audience
# "gman", 1 hour, rotated by the kubelet). The GMan API verifies it with this cluster's TokenReview API and
# takes the node from the token's pod binding (Kubernetes >= 1.30: node-name claim; older: get the bound pod),
# so a pod may send only the kubernetes-node snapshot of the node it runs on. No shared Secret with tokens.
#
# Before applying (namespace gman-gpu):
#   kubectl create namespace gman-gpu
#   kubectl -n gman-gpu create configmap gman-agent --from-file=collect.py=agent/collect.py
# Set GMAN_URL and GMAN_CLUSTER (the cluster agent's --source-id) below.
# After applying, give the API the reviewer credentials (README «Процессы GPU в Kubernetes»): GMAN_K8S_TOKEN_REVIEW
# in .env, keyed by GMAN_CLUSTER, from
#   kubectl -n gman-gpu get secret gman-token-reviewer -o jsonpath='{.data.token}' | base64 -d
#   kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}'
# as {"cluster-01": {"api_url": "https://<API server>:6443", "certificate_authority_data": "<base64>",
#                    "token": "<reviewer token>"}}  (or ca_file / token_file, see backend/app/k8s_tokens.py).
# Static per-node tokens (GMAN_AGENT_TOKENS "cluster-01.<node>") still work, e.g. for the systemd variant
# (deploy/systemd, GMAN_RUNTIME=kubernetes-node), but are not used by this DaemonSet any more.
# Remaining trust: root on a GPU node can read the tokens of pods on that node only (its own node).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gman-gpu-agent
  namespace: gman-gpu
---
# Used by the GMan API, outside the cluster: TokenReview (system:auth-delegator) and, for Kubernetes < 1.30
# whose tokens carry no node name, get pods in gman-gpu to resolve the bound pod's node.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gman-token-reviewer
  namespace: gman-gpu
---
# Long-lived token of gman-token-reviewer for the API (it is not a pod, so it cannot use a projected token).
# Rotate by deleting the Secret: Kubernetes issues a new token, then update the API's token_file.
apiVersion: v1
kind: Secret
metadata:
  name: gman-token-reviewer
  namespace: gman-gpu
  annotations:
    kubernetes.io/service-account.name: gman-token-reviewer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gman-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: gman-token-reviewer
    namespace: gman-gpu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gman-token-reviewer
  namespace: gman-gpu
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gman-token-reviewer
  namespace: gman-gpu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gman-token-reviewer
subjects:
  - kind: ServiceAccount
    name: gman-token-reviewer
    namespace: gman-gpu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gman-gpu-agent
rules:
  # Pods of its own node (field selector spec.nodeName) to map container IDs to pods. No Secrets, no exec.
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gman-gpu-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gman-gpu-agent
subjects:
  - kind: ServiceAccount
    name: gman-gpu-agent
    namespace: gman-gpu
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gman-gpu-agent
  namespace: gman-gpu
spec:
  selector:
    matchLabels: {app: gman-gpu-agent}
  template:
    metadata:
      labels: {app: gman-gpu-agent}
    spec:
      serviceAccountName: gman-gpu-agent
      # nvidia-smi reports PIDs of the caller's PID namespace, and /proc/<pid>/cgroup is read for those PIDs:
      # both need the node's PID namespace. Requires the "privileged" Pod Security level for this namespace.
      hostPID: true
      # Label set by NVIDIA GPU feature discovery (GPU Operator); replace with your GPU node selector.
      nodeSelector: {nvidia.com/gpu.present: 'true'}
      tolerations: [{operator: Exists}]
      # The NVIDIA container runtime injects nvidia-smi and the driver libraries (RuntimeClass created by the
      # GPU Operator). Remove the line if nvidia is the default containerd runtime on GPU nodes.
      runtimeClassName: nvidia
      containers:
        - name: agent
          image: python:3.12-slim
          command: ['sh', '-c']
          # One snapshot a minute; a failed run is not sent and the loop continues.
          args:
            - >-
              while true; do
              python3 -I /agent/collect.py --runtime kubernetes-node --cluster "$GMAN_CLUSTER" --node "$NODE_NAME"
              --source-id "$GMAN_CLUSTER.$NODE_NAME" --send;
              sleep 60; done
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: GMAN_CLUSTER
              value: cluster-01  # Same as the cluster inventory agent's --source-id.
            - name: GMAN_URL
              value: https://gman.example  # Replace with the portal/API address (HTTPS).
            # Bound token of this pod (re-read on every run, so the kubelet's rotation is picked up).
            - name: GMAN_AGENT_TOKEN_FILE
              value: /var/run/secrets/gman/token
            # Spool of unsent snapshots and the run lock; the root filesystem is read-only. emptyDir on purpose:
            # the API keeps only the latest snapshot of a node source (no instances, so no history), so snapshots
            # lost with a pod restart carry nothing the next snapshot a minute later does not.
            - name: GMAN_AGENT_STATE_DIR
              value: /var/lib/gman-agent
            # Expose the node's GPUs for nvidia-smi (utility only) without requesting nvidia.com/gpu,
            # as DCGM Exporter does: the agent does not take a GPU away from workloads.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            # /proc/<pid>/cgroup is world-readable: no capabilities are needed. If nvidia-smi lists no
            # processes on your driver as non-root, run as root but keep capabilities dropped.
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: agent, mountPath: /agent, readOnly: true}
            - {name: gman-token, mountPath: /var/run/secrets/gman, readOnly: true}
            - {name: state, mountPath: /var/lib/gman-agent}
      volumes:
        - name: state
          emptyDir: {sizeLimit: 64Mi}
        - name: agent
          configMap: {name: gman-agent}
        # Audience "gman": the API server will not accept it, and GMan will not accept the pod's default
        # API token (mounted as usual for list pods). Bound to this pod: invalid once the pod is deleted.
        - name: gman-token
          projected:
            sources:
              - serviceAccountToken: {audience: gman, expirationSeconds: 3600, path: token}
