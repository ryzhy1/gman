apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # Minimum step of panels: the scrape interval (GMAN_METRICS_INTERVAL seconds, set by compose).
    jsonData:
      timeInterval: ${GMAN_METRICS_INTERVAL}s
