# __METRICS_INTERVAL__ is replaced with GMAN_METRICS_INTERVAL seconds (default 5) when the container starts
# (deploy/images/prometheus.Dockerfile): scraping and rule evaluation run at the Collectors' pace.
global:
  scrape_interval: __METRICS_INTERVAL__
  scrape_timeout: __METRICS_INTERVAL__
  evaluation_interval: __METRICS_INTERVAL__
  external_labels:
    # Portal address for runbook links in alerts; expanded from the environment
    # (--enable-feature=expand-external-labels in deploy/compose.yaml).
    gman_portal: ${GMAN_PORTAL_URL}
rule_files: [/etc/prometheus/rules/*.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: otel
    static_configs:
      - targets: ['otel:8889']
    metric_relabel_configs:
      # kube-state-metrics: source_id (the cluster, as the inventory source_id) is k8s_cluster_name, which the
      # production gateway takes from the cluster's client certificate, not a label its Collector could set.
      - source_labels: [__name__, k8s_cluster_name]
        regex: 'kube_.+;(.+)'
        target_label: source_id
        replacement: '$1'
  # Inventory state for alerts (backend/src/exposition). Internal network only: nginx does not proxy /metrics.
  - job_name: gman-api
    static_configs:
      - targets: ['api:8000']
