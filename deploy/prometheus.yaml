global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    # Portal address for runbook links in alerts; expanded from the environment
    # (--enable-feature=expand-external-labels in deploy/compose.yaml).
    gman_portal: ${GMAN_PORTAL_URL}
rule_files: [/etc/prometheus/rules/*.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: otel
    static_configs:
      - targets: ['otel:8889']
  # Inventory state for alerts (backend/app/exposition.py). Internal network only: nginx does not proxy /metrics.
  - job_name: gman-api
    static_configs:
      - targets: ['api:8000']
