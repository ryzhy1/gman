# Node Collector in a container: host metrics from the host's root mounted at /hostfs, container metrics from the
# Docker socket. Service `node-otel` of the GMan server (deploy/compose.yaml) and of every other host
# (deploy/host/compose.yaml).
#   GMAN_HOST_ID  must equal the inventory agent's --source-id (compose: GMAN_SOURCE_ID).
#   GMAN_METRICS_INTERVAL  seconds between collections, default 5 (same value for Prometheus and DCGM).
#   OTEL_GATEWAY  host:port of the gateway's OTLP gRPC receiver, default otel:4317 (the GMan server itself).
#   GMAN_INFERENCE_HOST  address of this host as seen by the Collector, for vLLM/Triton ports published on the host: 127.0.0.1
#                   with network_mode: host (default), host.docker.internal on the GMan server (deploy/compose.yaml).
receivers:
  host_metrics:
    collection_interval: ${env:GMAN_METRICS_INTERVAL:-5}s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization: {enabled: true}
          system.cpu.frequency: {enabled: true}
      memory:
        metrics:
          system.memory.utilization: {enabled: true}
          system.memory.limit: {enabled: true}
      load: {}
      disk: {}
      filesystem:
        exclude_fs_types:
          fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs,
                     mqueue, nsfs, overlay, proc, procfs, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs,
                     sysfs, tracefs, tmpfs]
          match_type: strict
        metrics:
          system.filesystem.utilization: {enabled: true}
      network: {}
      paging: {}
      processes: {}
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: ${env:GMAN_METRICS_INTERVAL:-5}s
    container_labels_to_metric_labels:
      gman.service: gman_service
      gman.environment: gman_environment
    metrics:
      container.cpu.throttling_data.throttled_periods: {enabled: true}
      container.cpu.throttling_data.throttled_time: {enabled: true}
      container.pids.count: {enabled: true}
      container.uptime: {enabled: true}
      container.restarts: {enabled: true}
  # Model servers in Docker containers on this host, found by labels (README, «Метрики LLM», «Метрики Triton»):
  #   gman.metrics=vllm|triton, gman.metrics.port=<host port of /metrics: vLLM's OpenAI API port, Triton's 8002>,
  #   gman.service=<catalog id>. One job per server kind: exported_job tells them apart.
  # Every series is kept as exported (no allowlist), so metrics of new server versions appear without config changes.
  prometheus/llm:
    config:
      scrape_configs:
        - job_name: vllm
          scrape_interval: ${env:GMAN_METRICS_INTERVAL:-5}s
          scrape_timeout: ${env:GMAN_METRICS_INTERVAL:-5}s
          docker_sd_configs:
            - host: unix:///var/run/docker.sock
              filters:
                - name: label
                  values: ['gman.metrics=vllm']
          relabel_configs: &model_server_targets
            # $$ is a literal $ (regex group): the Collector expands $ as environment variables.
            # One target per container (Docker SD yields one per network port; equal targets are merged).
            - source_labels: [__meta_docker_container_label_gman_metrics_port]
              regex: '(\d+)'
              target_label: __address__
              replacement: '${env:GMAN_INFERENCE_HOST:-127.0.0.1}:$$1'
            - source_labels: [__meta_docker_container_label_gman_metrics_port]
              regex: '\d+'
              action: keep
            - source_labels: [__meta_docker_container_label_gman_service]
              target_label: gman_service
            - source_labels: [__meta_docker_container_label_gman_environment]
              target_label: gman_environment
            - source_labels: [__meta_docker_container_name]
              regex: '/?(.+)'
              target_label: container_name
        - job_name: triton
          scrape_interval: ${env:GMAN_METRICS_INTERVAL:-5}s
          scrape_timeout: ${env:GMAN_METRICS_INTERVAL:-5}s
          docker_sd_configs:
            - host: unix:///var/run/docker.sock
              filters:
                - name: label
                  values: ['gman.metrics=triton']
          relabel_configs: *model_server_targets
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource:
    attributes:
      - key: host.id
        value: ${env:GMAN_HOST_ID}
        action: upsert
  batch: {}
exporters:
  otlp_grpc:
    # The gateway of the Compose network on the GMan server; <server>:4317 on other hosts (deploy/host/compose.yaml).
    endpoint: ${env:OTEL_GATEWAY:-otel:4317}
    tls: {insecure: true}
    # Keep retrying while the GMan server is unreachable (in memory; lost on restart of this Collector).
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0
service:
  pipelines:
    metrics:
      receivers: [host_metrics, docker_stats, prometheus/llm]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_grpc]
