# Node Collector for a Docker host. Run Collector contrib as a host process.
# Docker socket access must be granted separately. No remote Docker API needed.
# Environment:
#   GMAN_HOST_ID   must equal the inventory agent's --source-id: GMan joins metrics on it.
#                  It must also equal the CN of client.pem (deploy/pki/issue.sh client <GMAN_HOST_ID>):
#                  the production gateway drops metrics whose host.id differs from the certificate.
#   OTEL_GATEWAY   host:port of the central gateway's OTLP gRPC receiver.
#   DOCKER_SOCKET  optional, defaults to unix:///var/run/docker.sock.
#   GMAN_OTEL_STORAGE_DIR  optional, defaults to /var/lib/gman-otelcol (StateDirectory of
#                  deploy/systemd/gman-otelcol.service): the persistent sending queue.
receivers:
  host_metrics:
    collection_interval: 5s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization: {enabled: true}
          system.cpu.frequency: {enabled: true}
      memory:
        metrics:
          system.memory.utilization: {enabled: true}
          system.memory.limit: {enabled: true}
      load: {}
      disk: {}
      filesystem:
        exclude_fs_types:
          fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs,
                     mqueue, nsfs, overlay, proc, procfs, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs,
                     sysfs, tracefs, tmpfs]
          match_type: strict
        metrics:
          system.filesystem.utilization: {enabled: true}
      network: {}
      paging: {}
      processes: {}
  docker_stats:
    endpoint: ${env:DOCKER_SOCKET:-unix:///var/run/docker.sock}
    collection_interval: 5s
    # Catalog binding labels become metric labels so dashboards can filter by service.
    container_labels_to_metric_labels:
      gman.service: gman_service
      gman.environment: gman_environment
    metrics:
      container.cpu.throttling_data.throttled_periods: {enabled: true}
      container.cpu.throttling_data.throttled_time: {enabled: true}
      container.pids.count: {enabled: true}
      container.uptime: {enabled: true}
      container.restarts: {enabled: true}
  # GPU exporters on the same host; see README for their deployment. Either or both may run: rules prefer DCGM
  # per GPU and fall back to nvidia_gpu_exporter. A target that is not running only marks its `up` as 0.
  prometheus/gpu:
    config:
      scrape_configs:
        - job_name: dcgm
          scrape_interval: 5s
          scrape_timeout: 5s
          static_configs:
            - targets: ['127.0.0.1:9400']
        # github.com/utkuozdemir/nvidia_gpu_exporter (nvidia_smi_* series).
        - job_name: nvidia_smi
          scrape_interval: 5s
          scrape_timeout: 5s
          static_configs:
            - targets: ['127.0.0.1:9835']
  # Model servers in Docker containers on this host, found by labels (README, «Метрики LLM», «Метрики Triton»):
  #   gman.metrics=vllm|triton, gman.metrics.port=<host port of /metrics: vLLM's OpenAI API port, Triton's 8002>,
  #   gman.service=<catalog id>. One job per server kind: exported_job tells them apart.
  # The port is the published one (or the container's own with network_mode: host): this Collector runs on the host.
  prometheus/llm:
    config:
      scrape_configs:
        - job_name: vllm
          scrape_interval: 5s
          scrape_timeout: 5s
          docker_sd_configs:
            - host: ${env:DOCKER_SOCKET:-unix:///var/run/docker.sock}
              filters:
                - name: label
                  values: ['gman.metrics=vllm']
          relabel_configs: &model_server_targets
            # $$ is a literal $ (regex group): the Collector expands $ as environment variables.
            # One target per container (Docker SD yields one per network port; equal targets are merged).
            - source_labels: [__meta_docker_container_label_gman_metrics_port]
              regex: '(\d+)'
              target_label: __address__
              replacement: '127.0.0.1:$$1'
            - source_labels: [__meta_docker_container_label_gman_metrics_port]
              regex: '\d+'
              action: keep
            - source_labels: [__meta_docker_container_label_gman_service]
              target_label: gman_service
            - source_labels: [__meta_docker_container_label_gman_environment]
              target_label: gman_environment
            - source_labels: [__meta_docker_container_name]
              regex: '/?(.+)'
              target_label: container_name
        - job_name: triton
          scrape_interval: 5s
          scrape_timeout: 5s
          docker_sd_configs:
            - host: ${env:DOCKER_SOCKET:-unix:///var/run/docker.sock}
              filters:
                - name: label
                  values: ['gman.metrics=triton']
          relabel_configs: *model_server_targets
extensions:
  # Persistent sending queue: batches the gateway has not accepted survive a restart of this Collector or
  # of the host and are sent when the gateway is back (README, «Очередь Collector на диске»).
  file_storage:
    directory: ${env:GMAN_OTEL_STORAGE_DIR:-/var/lib/gman-otelcol}
    create_directory: true
    # The bbolt file does not shrink by itself: compact it after a backlog is drained and at start.
    compaction:
      on_start: true
      on_rebound: true
      # Defaults to /var/lib/otelcol/file_storage, outside the unit's writable paths.
      directory: ${env:GMAN_OTEL_STORAGE_DIR:-/var/lib/gman-otelcol}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource:
    attributes:
      - key: host.id
        value: ${env:GMAN_HOST_ID}
        action: upsert
  batch: {}
exporters:
  otlp_grpc:
    endpoint: ${env:OTEL_GATEWAY}
    tls:
      ca_file: /etc/gman/ca.pem
      cert_file: /etc/gman/client.pem
      key_file: /etc/gman/client-key.pem
    # Queue on disk, capped by size of the serialized data: ~256 MiB holds several hours of a busy host
    # (README). When full, new batches are dropped (otelcol_exporter_enqueue_failed_metric_points).
    sending_queue:
      storage: file_storage
      sizer: bytes
      queue_size: 268435456
    # Retry until the gateway is back (the default gives up after 5 minutes and drops the batch);
    # the queue limit above bounds what is kept.
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 0
service:
  extensions: [file_storage]
  pipelines:
    metrics:
      receivers: [host_metrics, docker_stats, prometheus/gpu, prometheus/llm]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_grpc]
