        values: '1x60'
    promql_expr_test:
      - expr: gman:kube_workload_replicas_outdated:max
        eval_time: 10m
        exp_samples:
          - labels: 'gman:kube_workload_replicas_outdated:max{source_id="cluster-01", namespace="shop", workload_kind="StatefulSet", workload="kafka", service_id="queue", environment="prod"}'
            value: 2
          - labels: 'gman:kube_workload_replicas_outdated:max{source_id="cluster-01", namespace="shop", workload_kind="StatefulSet", workload="zk"}'
            value: 3
          - labels: 'gman:kube_workload_replicas_outdated:max{source_id="cluster-01", namespace="shop", workload_kind="DaemonSet", workload="fluent"}'
            value: 2
      - expr: gman:kube_workload_replicas_outdated:max
        eval_time: 50m
        exp_samples:
          - labels: 'gman:kube_workload_replicas_outdated:max{source_id="cluster-01", namespace="shop", workload_kind="StatefulSet", workload="kafka", service_id="queue", environment="prod"}'
            value: 2
          - labels: 'gman:kube_workload_replicas_outdated:max{source_id="cluster-01", namespace="shop", workload_kind="DaemonSet", workload="fluent"}'
            value: 2
    alert_rule_test:
      # Outdated since 0 m: the condition holds from 30 m, firing after `for` at 35 m.
      - eval_time: 34m
        alertname: GManWorkloadRolloutStuck
        exp_alerts: []
      - eval_time: 36m
        alertname: GManWorkloadRolloutStuck
        exp_alerts:
          - exp_labels: {severity: warning, scope: workload, source_id: cluster-01, namespace: shop, workload_kind: StatefulSet, workload: kafka, service_id: queue, environment: prod, reason: OutdatedReplicas}
            exp_annotations:
              summary: 'StatefulSet shop/kafka: rollout не продвигается'
              description: 'Кластер cluster-01, сервис queue: 2 pod-ов на прежней версии шаблона, за 30 минут их число не уменьшилось. RollingUpdate остановлен неготовым pod-ом; при updateStrategy OnDelete pod-ы обновляются только после удаления.'
              runbook_url: https://gman.example/#alerts/GManWorkloadRolloutStuck
          - exp_labels: {severity: warning, scope: workload, source_id: cluster-01, namespace: shop, workload_kind: DaemonSet, workload: fluent, reason: OutdatedReplicas}
            exp_annotations:
              summary: 'DaemonSet shop/fluent: rollout не продвигается'
              description: 'Кластер cluster-01: 2 pod-ов на прежней версии шаблона, за 30 минут их число не уменьшилось. RollingUpdate остановлен неготовым pod-ом; при updateStrategy OnDelete pod-ы обновляются только после удаления.'
              runbook_url: https://gman.example/#alerts/GManWorkloadRolloutStuck

  - name: kube-state-metrics absent
    external_labels: {gman_portal: https://gman.example}
    interval: 1m
    input_series:
      - series: 'up{job="otel", instance="otel:8889"}'
        values: '1x30'
      # cluster-02 stops at 10 minutes; its series stay visible for the 5-minute lookback.
      - series: 'kube_node_info{job="otel", exported_job="kube-state-metrics", source_id="cluster-01", node="a"}'
        values: '1x30'
      - series: 'kube_node_info{job="otel", exported_job="kube-state-metrics", source_id="cluster-02", node="b"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 18m
        alertname: GManKubeStateMetricsAbsent
        exp_alerts: []
      - eval_time: 22m
        alertname: GManKubeStateMetricsAbsent
        exp_alerts:
          - exp_labels: {severity: warning, scope: pipeline, source_id: cluster-02}
            exp_annotations:
              summary: 'Нет метрик kube-state-metrics кластера cluster-02'
              description: 'Алерты workloads этого кластера (реплики, rollout, Pending, Job, DaemonSet) не вычисляются: остановлен kube-state-metrics или Collector его узла.'
              runbook_url: https://gman.example/#alerts/GManKubeStateMetricsAbsent

  - name: docker oom under restart policy
    external_labels: {gman_portal: https://gman.example}
    interval: 1m
    input_series:
      # OOM kill at 5m (agent --watch `oom` event); the restart policy restarted the container, so its
      # state carries no OOMKilled reason. Same kill also reported as state while it was stopped (5m-6m).
      - series: 'gman_instance_last_oom_timestamp_seconds{source_id="server-01", host_id="server-01", instance_id="c2", instance_name="trainer", namespace="", service_id="ml", environment="prod", runtime="docker", reason="OOMKilled"}'
        values: '_x5 300x50'
      - series: 'gman_instance_state_reason{source_id="server-01", host_id="server-01", instance_id="c2", instance_name="trainer", namespace="", service_id="ml", environment="prod", runtime="docker", reason="OOMKilled"}'
        values: '_x5 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: GManInstanceOOMKilled
        exp_alerts:
          - exp_labels: {severity: warning, scope: instance, source_id: server-01, host_id: server-01, instance_id: c2, instance_name: trainer, service_id: ml, environment: prod, runtime: docker, reason: OOMKilled}
            exp_annotations:
              summary: trainer завершен по OOMKilled
              description: "Контейнер trainer (сервис ml, server-01) превысил лимит памяти. Проверить лимит и потребление на вкладке «Ресурсы»."
              runbook_url: https://gman.example/#alerts/GManInstanceOOMKilled
      - eval_time: 20m
        alertname: GManInstanceOOMKilled
        exp_alerts:
          - exp_labels: {severity: warning, scope: instance, source_id: server-01, host_id: server-01, instance_id: c2, instance_name: trainer, service_id: ml, environment: prod, runtime: docker, reason: OOMKilled}
            exp_annotations:
              summary: trainer завершен по OOMKilled
              description: "Контейнер trainer (сервис ml, server-01) превысил лимит памяти. Проверить лимит и потребление на вкладке «Ресурсы»."
              runbook_url: https://gman.example/#alerts/GManInstanceOOMKilled
      # 30 minutes after the kill the alert resolves.
      - eval_time: 40m
        alertname: GManInstanceOOMKilled
        exp_alerts: []

  # api/prod: latest release fails at 2 minutes, the next release (rolling-out) replaces it at 10 minutes.
  # web/dev: succeeded. Labels as backend/app/exposition.py renders them.
  - name: release failed
    external_labels: {gman_portal: https://gman.example}
    interval: 1m
    input_series:
      - series: 'gman_release_status{job="gman-api", instance="api:8000", service_id="api", environment="prod", status="rolling-out"}'
        values: '1 1 _ _ _ _ _ _ _ _ _ _ _ _ _'
      - series: 'gman_release_status{job="gman-api", instance="api:8000", service_id="api", environment="prod", status="failed"}'
        values: '_ _ 1 1 1 1 1 1 1 1 _ _ _ _ _'
      - series: 'gman_release_status{job="gman-api", instance="api:8000", service_id="api", environment="prod", status="started"}'
        values: '_ _ _ _ _ _ _ _ _ _ 1 1 1 1 1'
      - series: 'gman_release_started_timestamp_seconds{job="gman-api", instance="api:8000", service_id="api", environment="prod"}'
        values: '60x9 600x5'
      - series: 'gman_release_status{job="gman-api", instance="api:8000", service_id="web", environment="dev", status="succeeded"}'
        values: '1x14'
    alert_rule_test:
      - eval_time: 1m
        alertname: GManReleaseFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: GManReleaseFailed
        exp_alerts:
          - exp_labels: {severity: warning, scope: release, service_id: api, environment: prod}
            exp_annotations:
              summary: 'Релиз api в prod завершился ошибкой'
              description: 'Последний релиз (начат 1970-01-01 00:01:00 +0000 UTC) в статусе failed: ошибка в Bamboo, сбой новых экземпляров или тайм-аут выката. Причина — на вкладке «Релизы» сервиса.'
              runbook_url: https://gman.example/#alerts/GManReleaseFailed
      # Without staleness markers in tests the failed series stays visible for the 5-minute lookback.
      - eval_time: 14m
        alertname: GManReleaseFailed
        exp_alerts: []


  # TLS files as backend/app/exposition.py renders them. time() starts at 0, so each expiry is set 5 minutes past
  # a threshold: crl.pem crosses 30 days, gateway.pem 7 days and portal.pem expires at 5 minutes.
  - name: tls expiry thresholds
    external_labels: {gman_portal: https://gman.example}
    interval: 1m
    input_series:
      - series: 'gman_tls_crl_next_update_timestamp_seconds{job="gman-api", instance="api:8000", file="/etc/gman/tls/crl.pem", issuer="CN=GMan pilot CA,O=GMan pilot"}'
        values: '2592300x10'
      - series: 'gman_tls_cert_not_after_timestamp_seconds{job="gman-api", instance="api:8000", file="/etc/gman/tls/gateway.pem", subject="CN=gman.example.org,OU=server,O=GMan pilot"}'
        values: '605100x10'
      - series: 'gman_tls_cert_not_after_timestamp_seconds{job="gman-api", instance="api:8000", file="/etc/gman/tls/portal.pem", subject="CN=portal.example.org,OU=server,O=GMan pilot"}'
        values: '300x10'
      # Five years: no alert.
      - series: 'gman_tls_cert_not_after_timestamp_seconds{job="gman-api", instance="api:8000", file="/etc/gman/tls/ca.pem", subject="CN=GMan pilot CA,O=GMan pilot"}'
        values: '157680000x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: GManTlsCrlExpiring
        exp_alerts: []
      - eval_time: 6m
        alertname: GManTlsCrlExpiring
        exp_alerts:
          - exp_labels: {severity: warning, scope: tls, job: gman-api, instance: 'api:8000', file: /etc/gman/tls/crl.pem, issuer: 'CN=GMan pilot CA,O=GMan pilot'}
            exp_annotations:
              summary: 'Список отзыва /etc/gman/tls/crl.pem истекает через 29d 23h 59m 0s'
              description: >-
                nextUpdate CRL (CN=GMan pilot CA,O=GMan pilot) через 29d 23h 59m 0s. После этого nginx отвергнет
                все клиентские сертификаты OTLP и телеметрия всех серверов остановится. Переподписать: issue.sh crl.
              runbook_url: https://gman.example/#alerts/GManTlsCrlExpiring
      # At 4 minutes gateway.pem is in the 30-day window, portal.pem has one minute left (both severities;
      # Alertmanager inhibits the warning of the same alertname, file and subject).
      - eval_time: 4m
        alertname: GManTlsCertExpiring
        exp_alerts:
          - exp_labels: {severity: warning, scope: tls, job: gman-api, instance: 'api:8000', file: /etc/gman/tls/gateway.pem, subject: 'CN=gman.example.org,OU=server,O=GMan pilot'}
            exp_annotations:
              summary: 'Сертификат CN=gman.example.org,OU=server,O=GMan pilot истекает через 7d 0h 1m 0s'
              description: 'Файл /etc/gman/tls/gateway.pem: notAfter через 7d 0h 1m 0s. Перевыпустить и заменить на сервере.'
              runbook_url: https://gman.example/#alerts/GManTlsCertExpiring
          - exp_labels: {severity: warning, scope: tls, job: gman-api, instance: 'api:8000', file: /etc/gman/tls/portal.pem, subject: 'CN=portal.example.org,OU=server,O=GMan pilot'}
            exp_annotations:
              summary: 'Сертификат CN=portal.example.org,OU=server,O=GMan pilot истекает через 1m 0s'
              description: 'Файл /etc/gman/tls/portal.pem: notAfter через 1m 0s. Перевыпустить и заменить на сервере.'
              runbook_url: https://gman.example/#alerts/GManTlsCertExpiring
          - exp_labels: {severity: critical, scope: tls, job: gman-api, instance: 'api:8000', file: /etc/gman/tls/portal.pem, subject: 'CN=portal.example.org,OU=server,O=GMan pilot'}
            exp_annotations:
              summary: 'Сертификат CN=portal.example.org,OU=server,O=GMan pilot истекает через 1m 0s'
              description: 'Файл /etc/gman/tls/portal.pem: notAfter через 1m 0s. Перевыпустить и заменить на сервере.'
              runbook_url: https://gman.example/#alerts/GManTlsCertExpiring
      # At 6 minutes gateway.pem is inside 7 days and portal.pem has expired.
      - eval_time: 6m
        alertname: GManTlsCertExpiring
        exp_alerts:
          - exp_labels: {severity: warning, scope: tls, job: gman-api, instance: 'api:8000', file: /etc/gman/tls/gateway.pem, subject: 'CN=gman.example.org,OU=server,O=GMan pilot'}
            exp_annotations:
              summary: 'Сертификат CN=gman.example.org,OU=server,O=GMan pilot истекает через 6d 23h 59m 0s'
              description: 'Файл /etc/gman/tls/gateway.pem: notAfter через 6d 23h 59m 0s. Перевыпустить и заменить на сервере.'
              runbook_url: https://gman.example/#alerts/GManTlsCertExpiring
          - exp_labels: {severity: critical, scope: tls, job: gman-api, instance: 'api:8000', file: /etc/gman/tls/gateway.pem, subject: 'CN=gman.example.org,OU=server,O=GMan pilot'}
            exp_annotations:
              summary: 'Сертификат CN=gman.example.org,OU=server,O=GMan pilot истекает через 6d 23h 59m 0s'
              description: 'Файл /etc/gman/tls/gateway.pem: notAfter через 6d 23h 59m 0s. Перевыпустить и заменить на сервере.'
              runbook_url: https://gman.example/#alerts/GManTlsCertExpiring
      - eval_time: 4m
        alertname: GManTlsCertExpired
        exp_alerts: []
      - eval_time: 6m
        alertname: GManTlsCertExpired
        exp_alerts:
          - exp_labels: {severity: critical, scope: tls, job: gman-api, instance: 'api:8000', file: /etc/gman/tls/portal.pem, subject: 'CN=portal.example.org,OU=server,O=GMan pilot'}
            exp_annotations:
              summary: 'Сертификат CN=portal.example.org,OU=server,O=GMan pilot просрочен'
              description: >-
                Файл /etc/gman/tls/portal.pem: notAfter прошел 1m 0s назад. Клиенты не доверяют
                порталу или OTLP endpoint (серверный сертификат) либо любому сертификату пилотного CA (CA).
              runbook_url: https://gman.example/#alerts/GManTlsCertExpired

  # crl.pem expires at 10 minutes: both severities of GManTlsCrlExpiring before, GManTlsCrlExpired after.
  - name: tls crl expired
    external_labels: {gman_portal: https://gman.example}
    interval: 1m
    input_series:
      - series: 'gman_tls_crl_next_update_timestamp_seconds{job="gman-api", instance="api:8000", file="/etc/gman/tls/crl.pem", issuer="CN=GMan pilot CA,O=GMan pilot"}'
        values: '600x15'
    alert_rule_test:
      - eval_time: 8m
        alertname: GManTlsCrlExpiring
        exp_alerts:
          - exp_labels: {severity: warning, scope: tls, job: gman-api, instance: 'api:8000', file: /etc/gman/tls/crl.pem, issuer: 'CN=GMan pilot CA,O=GMan pilot'}
            exp_annotations:
              summary: 'Список отзыва /etc/gman/tls/crl.pem истекает через 2m 0s'
              description: >-
                nextUpdate CRL (CN=GMan pilot CA,O=GMan pilot) через 2m 0s. После этого nginx отвергнет
                все клиентские сертификаты OTLP и телеметрия всех серверов остановится. Переподписать: issue.sh crl.
              runbook_url: https://gman.example/#alerts/GManTlsCrlExpiring
          - exp_labels: {severity: critical, scope: tls, job: gman-api, instance: 'api:8000', file: /etc/gman/tls/crl.pem, issuer: 'CN=GMan pilot CA,O=GMan pilot'}
            exp_annotations:
              summary: 'Список отзыва /etc/gman/tls/crl.pem истекает через 2m 0s'
              description: >-
                nextUpdate CRL (CN=GMan pilot CA,O=GMan pilot) через 2m 0s. После этого nginx отвергнет
                все клиентские сертификаты OTLP и телеметрия всех серверов остановится. Переподписать: issue.sh crl.
              runbook_url: https://gman.example/#alerts/GManTlsCrlExpiring
      - eval_time: 8m
        alertname: GManTlsCrlExpired
        exp_alerts: []
      - eval_time: 12m
        alertname: GManTlsCrlExpiring
        exp_alerts: []
      - eval_time: 12m
        alertname: GManTlsCrlExpired
        exp_alerts:
          - exp_labels: {severity: critical, scope: tls, job: gman-api, instance: 'api:8000', file: /etc/gman/tls/crl.pem, issuer: 'CN=GMan pilot CA,O=GMan pilot'}
            exp_annotations:
              summary: 'Список отзыва /etc/gman/tls/crl.pem просрочен'
              description: >-
                nextUpdate CRL (CN=GMan pilot CA,O=GMan pilot) прошел 2m 0s назад: nginx отвергает все
                клиентские сертификаты OTLP, телеметрия серверов не принимается.
              runbook_url: https://gman.example/#alerts/GManTlsCrlExpired

  # crl.pem became unreadable at 2 minutes (e.g. replaced with mode 0600); portal.pem is fine.
  - name: tls file error
    external_labels: {gman_portal: https://gman.example}
    interval: 1m
    input_series:
      - series: 'gman_tls_file_error{job="gman-api", instance="api:8000", file="/etc/gman/tls/crl.pem"}'
        values: '0 0 1x10'
      - series: 'gman_tls_file_error{job="gman-api", instance="api:8000", file="/etc/gman/tls/portal.pem"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: GManTlsFileError
        exp_alerts: []
      - eval_time: 8m
        alertname: GManTlsFileError
        exp_alerts:
          - exp_labels: {severity: warning, scope: tls, job: gman-api, instance: 'api:8000', file: /etc/gman/tls/crl.pem}
            exp_annotations:
              summary: 'API не может прочитать /etc/gman/tls/crl.pem'
