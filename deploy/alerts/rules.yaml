# GMan alert rules for Prometheus. Tests: deploy/alerts/rules.test.yaml (promtool test rules).
# Sources of series:
#   system_*, DCGM_FI_*  telemetry through the OTel gateway (deploy/otel-*.yaml); host_id = GMAN_HOST_ID or node name.
#                        DCGM fields as enabled in deploy/dcgm-counters.csv; counters carry the suffix _total.
#   kube_*               kube-state-metrics (deploy/kube-state-metrics.yaml) through the cluster's node Collector;
#                        source_id = cluster (K8S_CLUSTER_NAME), no host_id.
#   gman_*               inventory state from the API's /metrics (backend/src/exposition).
#   nvidia_smi_*         nvidia_gpu_exporter (github.com/utkuozdemir/nvidia_gpu_exporter) scraped by the node Collector;
#                        GPUs are labelled uuid without the "GPU-" prefix, rules below add it as UUID like DCGM.
#   vllm:*               vLLM /metrics scraped by the node Collector, names as vLLM exports them;
#                        gman_service binds the server to the catalog, model_name is vLLM's own label.
# The gateway re-exports `up` of the Collectors' own scrapes (DCGM, kube-state-metrics) with exported_job set:
# the gateway's own target is up{job="otel", exported_job=""}.
# Labels used by Alertmanager (deploy/alerts/alertmanager.yaml):
#   severity  critical | warning | none (GManWatchdog only: the dead man's switch, routed to its own receiver)
#   scope     pipeline | node | gpu | instance | workload | release | tls | heartbeat: inhibition suppresses gpu/instance
#             alerts of a node that is down (GManNodeDown, GManK8sNodeNotReady) and instance alerts of a silent
#             inventory source.
# runbook_url opens the portal's alerts page; GMAN_PORTAL_URL reaches it as external label gman_portal.
groups:
  - name: gman-recording
    rules:
      # One series per GPU; DCGM is preferred, nvidia-smi from inventory fills in where DCGM is absent.
      # Then nvidia_gpu_exporter, then the inventory snapshot.
      - record: gman:gpu_temperature_celsius:max
        expr: |
          max by (host_id, UUID) (DCGM_FI_DEV_GPU_TEMP)
          or max by (host_id, UUID) (label_replace(nvidia_smi_temperature_gpu, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
          or max by (host_id, UUID) (gman_gpu_temperature_celsius)
      # Bitmask of active clock throttle reasons. DCGM renamed the field in 3.3 (CLOCK_THROTTLE -> CLOCKS_EVENT).
      # nvidia_gpu_exporter reports one 0/1 series per reason (clocks_event_reasons_* since driver 535, earlier
      # clocks_throttle_reasons_*), combined here into the same bits; a reason the driver omits counts as inactive.
      - record: gman:gpu_clock_event_reasons:max
        expr: |
          max by (host_id, UUID) (DCGM_FI_DEV_CLOCKS_EVENT_REASONS or DCGM_FI_DEV_CLOCK_THROTTLE_REASONS)
          or max by (host_id, UUID) (label_replace(
            (max by (host_id, uuid) (nvidia_smi_clocks_event_reasons_gpu_idle or nvidia_smi_clocks_throttle_reasons_gpu_idle)
             or max by (host_id, uuid) (nvidia_smi_gpu_info) * 0) * 1
            + (max by (host_id, uuid) (nvidia_smi_clocks_event_reasons_applications_clocks_setting or nvidia_smi_clocks_throttle_reasons_applications_clocks_setting)
             or max by (host_id, uuid) (nvidia_smi_gpu_info) * 0) * 2
            + (max by (host_id, uuid) (nvidia_smi_clocks_event_reasons_sw_power_cap or nvidia_smi_clocks_throttle_reasons_sw_power_cap)
             or max by (host_id, uuid) (nvidia_smi_gpu_info) * 0) * 4
            + (max by (host_id, uuid) (nvidia_smi_clocks_event_reasons_hw_slowdown or nvidia_smi_clocks_throttle_reasons_hw_slowdown)
             or max by (host_id, uuid) (nvidia_smi_gpu_info) * 0) * 8
            + (max by (host_id, uuid) (nvidia_smi_clocks_event_reasons_sync_boost or nvidia_smi_clocks_throttle_reasons_sync_boost)
             or max by (host_id, uuid) (nvidia_smi_gpu_info) * 0) * 16
            + (max by (host_id, uuid) (nvidia_smi_clocks_event_reasons_sw_thermal_slowdown or nvidia_smi_clocks_throttle_reasons_sw_thermal_slowdown)
             or max by (host_id, uuid) (nvidia_smi_gpu_info) * 0) * 32
            + (max by (host_id, uuid) (nvidia_smi_clocks_event_reasons_hw_thermal_slowdown or nvidia_smi_clocks_throttle_reasons_hw_thermal_slowdown)
             or max by (host_id, uuid) (nvidia_smi_gpu_info) * 0) * 64
            + (max by (host_id, uuid) (nvidia_smi_clocks_event_reasons_hw_power_brake_slowdown or nvidia_smi_clocks_throttle_reasons_hw_power_brake_slowdown)
             or max by (host_id, uuid) (nvidia_smi_gpu_info) * 0) * 128,
            "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
          or max by (host_id, UUID) (gman_gpu_clock_event_reasons)
      # GPU state in one set of series for the gman-gpu dashboard and the portal, whichever exporter the host runs.
      - record: gman:gpu_utilization:ratio
        expr: |
          max by (host_id, UUID) (DCGM_FI_DEV_GPU_UTIL) / 100
          or max by (host_id, UUID) (label_replace(nvidia_smi_utilization_gpu_ratio, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
      # Share of time device memory was read or written (not VRAM occupancy).
      - record: gman:gpu_memory_activity:ratio
        expr: |
          max by (host_id, UUID) (DCGM_FI_DEV_MEM_COPY_UTIL) / 100
          or max by (host_id, UUID) (label_replace(nvidia_smi_utilization_memory_ratio, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
      - record: gman:gpu_memory_used_bytes:max
        expr: |
          max by (host_id, UUID) (DCGM_FI_DEV_FB_USED) * 1048576
          or max by (host_id, UUID) (label_replace(nvidia_smi_memory_used_bytes, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
      - record: gman:gpu_memory_total_bytes:max
        expr: |
          (max by (host_id, UUID) (DCGM_FI_DEV_FB_USED) + max by (host_id, UUID) (DCGM_FI_DEV_FB_FREE)) * 1048576
          or max by (host_id, UUID) (label_replace(nvidia_smi_memory_total_bytes, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
      - record: gman:gpu_power_watts:max
        expr: |
          max by (host_id, UUID) (DCGM_FI_DEV_POWER_USAGE)
          or max by (host_id, UUID) (label_replace(nvidia_smi_power_draw_watts, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
      # Limit in force: enforced, otherwise the configured one (nvidia_gpu_exporter only).
      - record: gman:gpu_power_limit_watts:max
        expr: |
          max by (host_id, UUID) (label_replace(nvidia_smi_enforced_power_limit_watts, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
          or max by (host_id, UUID) (label_replace(nvidia_smi_power_limit_watts, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
      - record: gman:gpu_sm_clock_hertz:max
        expr: |
          max by (host_id, UUID) (DCGM_FI_DEV_SM_CLOCK) * 1e6
          or max by (host_id, UUID) (label_replace(nvidia_smi_clocks_current_sm_clock_hz, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
      - record: gman:gpu_memory_clock_hertz:max
        expr: |
          max by (host_id, UUID) (DCGM_FI_DEV_MEM_CLOCK) * 1e6
          or max by (host_id, UUID) (label_replace(nvidia_smi_clocks_current_memory_clock_hz, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
      - record: gman:gpu_max_sm_clock_hertz:max
        expr: max by (host_id, UUID) (label_replace(nvidia_smi_clocks_max_sm_clock_hz, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
      - record: gman:gpu_fan:ratio
        expr: max by (host_id, UUID) (label_replace(nvidia_smi_fan_speed_ratio, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
      # P-state: 0 is maximum performance, 8 and above idle.
      - record: gman:gpu_pstate:max
        expr: max by (host_id, UUID) (label_replace(nvidia_smi_pstate, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
      # Cumulative energy in joules: DCGM counts millijoules.
      - record: gman:gpu_energy_joules:total
        expr: |
          max by (host_id, UUID) (DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION_total) / 1000
          or max by (host_id, UUID) (label_replace(nvidia_smi_energy_joules_total, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
      # Hosts that should be sending telemetry: seen in the last 6 hours or known to inventory.
      - record: gman:host_expected:max
        expr: |
          max by (host_id) (max_over_time(system_cpu_load_average_1m[6h]) * 0 + 1)
          or max by (host_id) (gman_source_last_snapshot_timestamp_seconds{source_type="docker-host"} * 0 + 1)
          or max by (host_id) (gman_k8s_node_ready * 0 + 1)
      - record: gman:host_telemetry_missing:max
        expr: gman:host_expected:max unless on (host_id) max by (host_id) (system_cpu_load_average_1m)

  # Overheating thresholds of GManGpuOverheating per GPU model. A GPU of a model without a row uses 85 °C
  # (warning) and 90 °C (critical). model is the exact name as DCGM (label modelName) and nvidia-smi report it.
  # Values: warning = GPU Max Operating Temp, critical = GPU Slowdown Temp - 2 from
  # `nvidia-smi -q -d TEMPERATURE` (DCGM_FI_DEV_SLOWDOWN_TEMP on the «Хост» dashboard). Check them on the
  # pilot's cards; add a model with two rules (warning and critical).
  - name: gman-gpu-thresholds
    rules:
      - record: gman:gpu_model_temperature_threshold_celsius
        expr: vector(85)
        labels: {model: NVIDIA A100-SXM4-80GB, severity: warning}
      - record: gman:gpu_model_temperature_threshold_celsius
        expr: vector(87)
        labels: {model: NVIDIA A100-SXM4-80GB, severity: critical}
      - record: gman:gpu_model_temperature_threshold_celsius
        expr: vector(85)
        labels: {model: NVIDIA A100-SXM4-40GB, severity: warning}
      - record: gman:gpu_model_temperature_threshold_celsius
        expr: vector(87)
        labels: {model: NVIDIA A100-SXM4-40GB, severity: critical}
      # Model of each GPU: DCGM first, then nvidia_gpu_exporter, then nvidia-smi from inventory. One series per GPU.
      - record: gman:gpu_model:info
        expr: |
          topk by (host_id, UUID) (1,
            group by (host_id, UUID, model) (label_replace(DCGM_FI_DEV_GPU_TEMP, "model", "$1", "modelName", "(.+)"))
            or on (host_id, UUID) group by (host_id, UUID, model) (label_replace(
              label_replace(nvidia_smi_gpu_info, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"), "model", "$1", "name", "(.+)"))
            or on (host_id, UUID) group by (host_id, UUID, model) (gman_gpu_temperature_celsius{model!=""}))
      # Threshold of every GPU with a temperature: the model's row, otherwise the default.
      - record: gman:gpu_temperature_threshold_celsius
        expr: |
          max by (host_id, UUID) (
            gman:gpu_model:info * on (model) group_left () gman:gpu_model_temperature_threshold_celsius{severity="warning"})
          or max by (host_id, UUID) (gman:gpu_temperature_celsius:max) * 0 + 85
        labels: {severity: warning}
      - record: gman:gpu_temperature_threshold_celsius
        expr: |
          max by (host_id, UUID) (
            gman:gpu_model:info * on (model) group_left () gman:gpu_model_temperature_threshold_celsius{severity="critical"})
          or max by (host_id, UUID) (gman:gpu_temperature_celsius:max) * 0 + 90
        labels: {severity: critical}

  # Dead man's switch: always firing. Alertmanager sends it every ~5 minutes to the external heartbeat service
  # only (GMAN_ALERT_HEARTBEAT_URL, deploy/alerts/alertmanager.sh), which alerts when the pings stop: the server,
  # Prometheus, rule evaluation, Alertmanager or its outbound network is down. Not shown in the portal.
  - name: gman-heartbeat
    rules:
      - alert: GManWatchdog
        expr: vector(1)
        labels: {severity: none, scope: heartbeat}
        annotations:
          summary: Сигнал жизни конвейера алертов GMan
          description: >-
            Срабатывает всегда. Внешний сервис (GMAN_ALERT_HEARTBEAT_URL) поднимает тревогу, если сигнал перестал
            приходить: сервер GMan, Prometheus или Alertmanager не работают либо нет исходящей сети.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManWatchdog'

  - name: gman-pipeline
    rules:
      - alert: GManTelemetryGatewayDown
        expr: up{job="otel", exported_job=""} == 0
        for: 2m
        labels: {severity: critical, scope: pipeline}
        annotations:
          summary: OTel gateway недоступен для Prometheus
          description: Prometheus не может прочитать метрики gateway (otel:8889). Телеметрия всех хостов не поступает.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManTelemetryGatewayDown'
      - alert: GManApiMetricsDown
        expr: up{job="gman-api"} == 0
        for: 2m
        labels: {severity: critical, scope: pipeline}
        annotations:
          summary: API GMan не отдает /metrics
          description: Алерты по inventory (молчащие источники, OOMKilled, CrashLoopBackOff) не вычисляются.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManApiMetricsDown'

  - name: gman-nodes
    rules:
      - alert: GManSourceSilent
        expr: time() - gman_source_last_snapshot_timestamp_seconds > 300
        for: 1m
        labels: {severity: warning, scope: node}
        annotations:
          summary: 'Источник {{ $labels.source_id }} не присылает inventory'
          description: >-
            Последний снимок принят {{ $value | humanizeDuration }} назад (агент отправляет раз в минуту).
            Данные портала по этому источнику устарели.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManSourceSilent'
      # Not raised while the gateway itself is down: GManTelemetryGatewayDown covers that case.
      - alert: GManHostTelemetryAbsent
        expr: gman:host_telemetry_missing:max and on () (up{job="otel", exported_job=""} == 1)
        for: 5m
        labels: {severity: warning, scope: node}
        annotations:
          summary: 'Нет метрик хоста {{ $labels.host_id }}'
          description: >-
            Хост известен по inventory или присылал метрики за последние 6 часов, но метрик OTel сейчас нет:
            остановлен Collector, нет связи с gateway или хост выключен.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManHostTelemetryAbsent'
      # Docker host down: both independent channels (inventory agent and OTel Collector) are silent.
      # Inhibits the host's other alerts (deploy/alerts/alertmanager.yaml).
      - alert: GManNodeDown
        expr: |
          max by (host_id, source_id) (time() - gman_source_last_snapshot_timestamp_seconds{source_type="docker-host"}) > 300
          and on (host_id) gman:host_telemetry_missing:max
        for: 1m
        labels: {severity: critical, scope: node}
        annotations:
          summary: 'Хост {{ $labels.host_id }} недоступен'
          description: >-
            Нет ни inventory ({{ $value | humanizeDuration }}), ни метрик OTel: хост выключен или потерял сеть.
            Алерты GPU и контейнеров этого хоста подавлены.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManNodeDown'
      - alert: GManK8sNodeNotReady
        expr: gman_k8s_node_ready == 0
        for: 2m
        labels: {severity: critical, scope: node}
        annotations:
          summary: 'Узел Kubernetes {{ $labels.host_id }} в состоянии NotReady'
          description: 'Кластер {{ $labels.source_id }}: условие Ready узла ложно или неизвестно.'
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManK8sNodeNotReady'

  - name: gman-gpu
    rules:
      - alert: GManGpuTelemetryAbsent
        expr: |
          max by (host_id, UUID) (max_over_time(DCGM_FI_DEV_GPU_TEMP[6h]))
          unless on (host_id, UUID) max by (host_id, UUID) (DCGM_FI_DEV_GPU_TEMP)
          and on () (up{job="otel", exported_job=""} == 1)
        for: 5m
        labels: {severity: warning, scope: gpu}
        annotations:
          summary: 'Нет метрик DCGM для GPU {{ $labels.UUID }} на {{ $labels.host_id }}'
          description: Метрики хоста поступают, а DCGM Exporter перестал отвечать или GPU пропал из системы.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManGpuTelemetryAbsent'
      - alert: GManGpuTelemetryAbsent
        expr: |
          max by (host_id, UUID) (label_replace(max_over_time(nvidia_smi_temperature_gpu[6h]), "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
          unless on (host_id, UUID) max by (host_id, UUID) (label_replace(nvidia_smi_temperature_gpu, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)"))
          and on () (up{job="otel", exported_job=""} == 1)
        for: 5m
        labels: {severity: warning, scope: gpu, source: nvidia_gpu_exporter}
        annotations:
          summary: 'Нет метрик nvidia_gpu_exporter для GPU {{ $labels.UUID }} на {{ $labels.host_id }}'
          description: Метрики хоста поступают, а nvidia_gpu_exporter перестал отвечать или GPU пропал из системы.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManGpuTelemetryAbsent'
      # DCGM keeps the last XID code until the GPU is reset; after handling, silence the alert in Alertmanager.
      - alert: GManGpuXidError
        expr: max by (host_id, UUID) (DCGM_FI_DEV_XID_ERRORS) > 0
        labels: {severity: warning, scope: gpu}
        annotations:
          summary: 'XID {{ $value }} на GPU {{ $labels.UUID }} ({{ $labels.host_id }})'
          description: Драйвер NVIDIA сообщил ошибку XID. Коды 13, 31, 43, 45 обычно вызваны приложением.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManGpuXidError'
      # Hardware/driver XIDs: 48 DBE ECC, 64 row remap failure, 74 NVLink, 79 fallen off the bus,
      # 92 high SBE rate, 94/95 contained/uncontained ECC, 119/120 GSP. Inhibits the warning above.
      - alert: GManGpuXidError
        expr: |
          max by (host_id, UUID) (
            DCGM_FI_DEV_XID_ERRORS == 48 or DCGM_FI_DEV_XID_ERRORS == 64 or DCGM_FI_DEV_XID_ERRORS == 74
            or DCGM_FI_DEV_XID_ERRORS == 79 or DCGM_FI_DEV_XID_ERRORS == 92 or DCGM_FI_DEV_XID_ERRORS == 94
            or DCGM_FI_DEV_XID_ERRORS == 95 or DCGM_FI_DEV_XID_ERRORS == 119 or DCGM_FI_DEV_XID_ERRORS == 120)
        labels: {severity: critical, scope: gpu}
        annotations:
          summary: 'Аппаратная XID {{ $value }} на GPU {{ $labels.UUID }} ({{ $labels.host_id }})'
          description: Ошибка указывает на память, шину или прошивку GPU. Нужен вывод GPU из работы и проверка.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManGpuXidError'
      # nvidia_gpu_exporter (nvml backend) keeps the time of the last XID; increase() of its counter misses the
      # first event of a series, so the alert holds for 15 minutes after each XID instead.
      - alert: GManGpuXidError
        expr: |
          max by (host_id, UUID) (label_replace(time() - nvidia_smi_xid_last_timestamp_seconds, "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)")) < 900
        labels: {severity: warning, scope: gpu, source: nvidia_gpu_exporter}
        annotations:
          summary: 'Недавняя XID-ошибка на GPU {{ $labels.UUID }} ({{ $labels.host_id }})'
          description: 'nvidia_gpu_exporter зафиксировал XID {{ $value | humanizeDuration }} назад; код — на дашборде GMan · GPU.'
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManGpuXidError'
      - alert: GManGpuEccUncorrectable
        expr: |
          max by (host_id, UUID) (increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL_total[10m]) > 0)
          or max by (host_id, UUID) (increase(gman_gpu_ecc_uncorrected_errors[10m]) > 0)
          or max by (host_id, UUID) (label_replace(increase(nvidia_smi_ecc_errors_uncorrected_aggregate_total[10m]), "UUID", "GPU-$1", "uuid", "(?:GPU-)?(.+)") > 0)
          or max by (host_id, UUID) (DCGM_FI_DEV_ROW_REMAP_FAILURE > 0)
        labels: {severity: critical, scope: gpu}
        annotations:
          summary: 'Неисправимые ошибки ECC на GPU {{ $labels.UUID }} ({{ $labels.host_id }})'
          description: Рост double-bit ECC (DCGM, nvidia_gpu_exporter или nvidia-smi) либо сбой переназначения строк памяти.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManGpuEccUncorrectable'
      - alert: GManGpuEccCorrectableHigh
        expr: max by (host_id, UUID) (increase(DCGM_FI_DEV_ECC_SBE_VOL_TOTAL_total[1h])) > 100
        labels: {severity: warning, scope: gpu}
        annotations:
          summary: 'Частые исправимые ошибки ECC на GPU {{ $labels.UUID }} ({{ $labels.host_id }})'
          description: 'Более 100 single-bit ECC за час ({{ $value | humanize }}). Предвестник деградации памяти.'
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManGpuEccCorrectableHigh'
      # Thresholds per GPU: the model's row in group gman-gpu-thresholds, otherwise 85/90 °C.
      - alert: GManGpuOverheating
        expr: gman:gpu_temperature_celsius:max > on (host_id, UUID) gman:gpu_temperature_threshold_celsius{severity="warning"}
        for: 5m
        labels: {severity: warning, scope: gpu}
        annotations:
          summary: 'GPU {{ $labels.UUID }} на {{ $labels.host_id }}: {{ $value }} °C'
          description: >-
            Температура GPU выше {{ with printf "gman:gpu_temperature_threshold_celsius{severity='warning',host_id='%s',UUID='%s'}" $labels.host_id $labels.UUID | query }}{{ . | first | value }}{{ end }} °C
            пять минут.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManGpuOverheating'
      - alert: GManGpuOverheating
        expr: gman:gpu_temperature_celsius:max > on (host_id, UUID) gman:gpu_temperature_threshold_celsius{severity="critical"}
        for: 2m
        labels: {severity: critical, scope: gpu}
        annotations:
          summary: 'GPU {{ $labels.UUID }} на {{ $labels.host_id }}: {{ $value }} °C'
          description: >-
            Температура GPU выше {{ with printf "gman:gpu_temperature_threshold_celsius{severity='critical',host_id='%s',UUID='%s'}" $labels.host_id $labels.UUID | query }}{{ . | first | value }}{{ end }} °C,
            близко к аппаратному снижению частот.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManGpuOverheating'
      - alert: GManGpuMemoryOverheating
        expr: max by (host_id, UUID) (DCGM_FI_DEV_MEMORY_TEMP) > 95
        for: 5m
        labels: {severity: warning, scope: gpu}
        annotations:
          summary: 'Память GPU {{ $labels.UUID }} на {{ $labels.host_id }}: {{ $value }} °C'
          description: Температура памяти (HBM) выше 95 °C пять минут.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManGpuMemoryOverheating'
      # Bits 0x20 sw_thermal and 0x40 hw_thermal.
      - alert: GManGpuThermalThrottling
        expr: floor(gman:gpu_clock_event_reasons:max / 32) % 4 > 0
        for: 5m
        labels: {severity: warning, scope: gpu}
        annotations:
          summary: 'Тепловой троттлинг GPU {{ $labels.UUID }} ({{ $labels.host_id }})'
          description: GPU снижает частоты из-за температуры (sw_thermal/hw_thermal) дольше пяти минут.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManGpuThermalThrottling'
      # Bits 0x8 hw_slowdown and 0x80 hw_power_brake: external signal, power supply or overheating.
      - alert: GManGpuHardwareSlowdown
        expr: |
          floor(gman:gpu_clock_event_reasons:max / 8) % 2 == 1
          or floor(gman:gpu_clock_event_reasons:max / 128) % 2 == 1
        for: 5m
        labels: {severity: warning, scope: gpu}
        annotations:
          summary: 'Аппаратное снижение частот GPU {{ $labels.UUID }} ({{ $labels.host_id }})'
          description: Активны hw_slowdown или hw_power_brake дольше пяти минут — проверить питание и охлаждение.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManGpuHardwareSlowdown'

  # vLLM per catalog service and model, over all replicas (5-minute windows). Latency quantiles are absent while
  # the model serves no requests. vLLM 0.10+ renamed time_per_output_token to inter_token_latency and
  # gpu_cache_usage_perc to kv_cache_usage_perc: both names are read.
  - name: gman-llm
    rules:
      # Time to first token: queueing plus prefill, what a streaming client waits before the answer starts.
      - record: gman:llm_ttft_seconds:p50
        expr: histogram_quantile(0.5, sum by (gman_service, model_name, le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))
      - record: gman:llm_ttft_seconds:p95
        expr: histogram_quantile(0.95, sum by (gman_service, model_name, le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))
      - record: gman:llm_ttft_seconds:p99
        expr: histogram_quantile(0.99, sum by (gman_service, model_name, le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))
      # Time per output token after the first one (decode speed seen by one request).
      - record: gman:llm_tpot_seconds:p50
        expr: histogram_quantile(0.5, sum by (gman_service, model_name, le) (rate(vllm:inter_token_latency_seconds_bucket[5m]) or rate(vllm:time_per_output_token_seconds_bucket[5m])))
      - record: gman:llm_tpot_seconds:p95
        expr: histogram_quantile(0.95, sum by (gman_service, model_name, le) (rate(vllm:inter_token_latency_seconds_bucket[5m]) or rate(vllm:time_per_output_token_seconds_bucket[5m])))
      - record: gman:llm_e2e_seconds:p50
        expr: histogram_quantile(0.5, sum by (gman_service, model_name, le) (rate(vllm:e2e_request_latency_seconds_bucket[5m])))
      - record: gman:llm_e2e_seconds:p95
        expr: histogram_quantile(0.95, sum by (gman_service, model_name, le) (rate(vllm:e2e_request_latency_seconds_bucket[5m])))
      - record: gman:llm_queue_seconds:p95
        expr: histogram_quantile(0.95, sum by (gman_service, model_name, le) (rate(vllm:request_queue_time_seconds_bucket[5m])))
      - record: gman:llm_requests:rate5m
        expr: sum by (gman_service, model_name) (rate(vllm:request_success_total[5m]))
      - record: gman:llm_prompt_tokens:rate5m
        expr: sum by (gman_service, model_name) (rate(vllm:prompt_tokens_total[5m]))
      - record: gman:llm_generation_tokens:rate5m
        expr: sum by (gman_service, model_name) (rate(vllm:generation_tokens_total[5m]))
      - record: gman:llm_requests_running:sum
        expr: sum by (gman_service, model_name) (vllm:num_requests_running)
      - record: gman:llm_requests_waiting:sum
        expr: sum by (gman_service, model_name) (vllm:num_requests_waiting)
      # KV cache occupancy, 0..1 despite the vLLM name "perc"; the fullest replica.
      - record: gman:llm_kv_cache_usage:max
        expr: max by (gman_service, model_name) (vllm:kv_cache_usage_perc or vllm:gpu_cache_usage_perc)
      # Requests evicted from the KV cache and recomputed later: the cache is too small for the load.
      - record: gman:llm_preemptions:rate5m
        expr: sum by (gman_service, model_name) (rate(vllm:num_preemptions_total[5m]))
      - record: gman:llm_prefix_cache_hit:ratio5m
        expr: |
          sum by (gman_service, model_name) (rate(vllm:prefix_cache_hits_total[5m]))
          / sum by (gman_service, model_name) (rate(vllm:prefix_cache_queries_total[5m])) > -1

      # `up` of the Collector's vllm and triton scrapes, re-exported by the gateway with exported_job.
      - alert: GManLlmEndpointDown
        expr: max by (host_id, gman_service, exported_job, exported_instance) (up{job="otel", exported_job=~"vllm|triton"}) == 0
        for: 3m
        labels: {severity: critical, scope: instance}
        annotations:
          summary: 'Сервер модели {{ $labels.gman_service }} ({{ $labels.exported_job }}) на {{ $labels.host_id }} не отвечает'
          description: 'Collector не может прочитать {{ $labels.exported_instance }}/metrics три минуты: сервер модели остановлен или завис.'
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManLlmEndpointDown'
      - alert: GManLlmSlowFirstToken
        expr: gman:llm_ttft_seconds:p95 > 5
        for: 10m
        labels: {severity: warning, scope: instance}
        annotations:
          summary: 'TTFT p95 {{ $labels.model_name }} ({{ $labels.gman_service }}): {{ $value | humanizeDuration }}'
          description: Пользователи ждут первый токен дольше 5 секунд (95-й перцентиль) десять минут.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManLlmSlowFirstToken'
      - alert: GManLlmQueueBacklog
        expr: gman:llm_queue_seconds:p95 > 5 and gman:llm_requests_waiting:sum > 0
        for: 10m
        labels: {severity: warning, scope: instance}
        annotations:
          summary: 'Очередь {{ $labels.model_name }} ({{ $labels.gman_service }}): ожидание p95 {{ $value | humanizeDuration }}'
          description: Запросы ждут начала обработки дольше 5 секунд десять минут — не хватает мощности сервера модели.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManLlmQueueBacklog'
      - alert: GManLlmKvCacheFull
        expr: gman:llm_kv_cache_usage:max > 0.95
        for: 15m
        labels: {severity: warning, scope: instance}
        annotations:
          summary: 'KV-кэш {{ $labels.model_name }} ({{ $labels.gman_service }}) заполнен на {{ $value | humanizePercentage }}'
          description: Кэш почти полон 15 минут; новые запросы ждут места, длинные контексты вытесняются.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManLlmKvCacheFull'
      - alert: GManLlmPreemptions
        expr: gman:llm_preemptions:rate5m > 0.1
        for: 10m
        labels: {severity: warning, scope: instance}
        annotations:
          summary: 'Вытеснения запросов {{ $labels.model_name }} ({{ $labels.gman_service }}): {{ $value | humanize }}/с'
          description: vLLM вытесняет запросы из KV-кэша и пересчитывает их — растут задержки и падает пропускная способность.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManLlmPreemptions'

  - name: gman-instances
    rules:
      # Kubernetes keeps OOMKilled as the last termination reason until the next one: count it only while
      # the restart counter grows. Docker reports OOMKilled while the container stays stopped; a container
      # restarted by its restart policy (or one whose child process was killed) is caught by the time of the
      # last OOM kill from the agent's --watch `oom` event, alerting for 30 minutes after it.
      - alert: GManInstanceOOMKilled
        expr: |
          gman_instance_state_reason{reason="OOMKilled"} == 1
          or (gman_instance_last_termination_reason{reason="OOMKilled"} == 1
              and on (source_id, instance_id) increase(gman_instance_restarts_total[30m]) > 0)
          or (time() - gman_instance_last_oom_timestamp_seconds < 1800)
        labels: {severity: warning, scope: instance}
        annotations:
          summary: '{{ $labels.instance_name }} завершен по OOMKilled'
          description: >-
            Контейнер {{ $labels.instance_name }} ({{ with $labels.service_id }}сервис {{ . }}, {{ end }}{{ $labels.host_id }})
            превысил лимит памяти. Проверить лимит и потребление на вкладке «Ресурсы».
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManInstanceOOMKilled'
      - alert: GManInstanceCrashLoopBackOff
        expr: gman_instance_state_reason{reason="CrashLoopBackOff"} == 1
        for: 5m
        labels: {severity: warning, scope: instance}
        annotations:
          summary: '{{ $labels.instance_name }} в CrashLoopBackOff'
          description: 'Pod {{ $labels.namespace }}/{{ $labels.instance_name }} (сервис {{ $labels.service_id }}) перезапускается с ошибкой.'
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManInstanceCrashLoopBackOff'
      - alert: GManInstanceRestartLoop
        expr: increase(gman_instance_restarts_total[30m]) >= 3
        labels: {severity: warning, scope: instance}
        annotations:
          summary: '{{ $labels.instance_name }}: {{ $value | humanize }} перезапусков за 30 минут'
          description: Контейнер (Docker restart policy или Kubernetes) часто перезапускается.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManInstanceRestartLoop'
      - alert: GManInstanceImagePullFailing
        expr: gman_instance_state_reason{reason=~"ImagePullBackOff|ErrImagePull"} == 1
        for: 10m
        labels: {severity: warning, scope: instance}
        annotations:
          summary: '{{ $labels.instance_name }} не может скачать образ'
          description: 'Pod {{ $labels.namespace }}/{{ $labels.instance_name }}: {{ $labels.reason }} дольше 10 минут.'
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManInstanceImagePullFailing'

  # Kubernetes workloads from kube-state-metrics. Object key: source_id (cluster), namespace, workload_kind,
  # workload; service_id/environment come from the pod labels gman.service/gman.environment of the workload's
  # pods (absent when the pods carry none). Recording rules come first: rules of a group are evaluated in order,
  # so the alerts below always see the join tables of the same evaluation.
  # Every query aggregates by the object key: series of the old and the new kube-state-metrics pod overlap
  # for up to 90 s after it moves to another node.
  - name: gman-workloads
    rules:
      # Workload of every pod: a Deployment through its ReplicaSet, the controller owner otherwise
      # (StatefulSet, DaemonSet, Job, a ReplicaSet of its own, custom controllers), the pod itself without one.
      - record: gman:kube_pod_workload:info
        expr: |
          topk by (source_id, namespace, pod) (1,
            label_replace(
              group by (source_id, namespace, pod, workload) (
                group by (source_id, namespace, pod, replicaset) (
                  label_replace(kube_pod_owner{owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.+)"))
                * on (source_id, namespace, replicaset) group_left (workload)
                topk by (source_id, namespace, replicaset) (1, group by (source_id, namespace, replicaset, workload) (
                  label_replace(kube_replicaset_owner{owner_kind="Deployment"}, "workload", "$1", "owner_name", "(.+)")))),
              "workload_kind", "Deployment", "workload", ".*")
            or on (source_id, namespace, pod)
            group by (source_id, namespace, pod, workload_kind, workload) (
              label_replace(label_replace(kube_pod_owner{owner_kind!=""},
                "workload_kind", "$1", "owner_kind", "(.+)"), "workload", "$1", "owner_name", "(.+)"))
            or on (source_id, namespace, pod)
            label_replace(label_replace(group by (source_id, namespace, pod) (kube_pod_owner),
              "workload", "$1", "pod", "(.+)"), "workload_kind", "Pod", "workload", ".*"))
      - record: gman:kube_pod_service:info
        expr: |
          topk by (source_id, namespace, pod) (1,
            group by (source_id, namespace, pod, service_id, environment) (
              label_replace(label_replace(kube_pod_labels{label_gman_service!=""},
                "service_id", "$1", "label_gman_service", "(.+)"), "environment", "$1", "label_gman_environment", "(.*)")))
      # One series per workload, with the service of its pods when known. Workloads without pods are listed too,
      # so joins with this table never drop an alert.
      - record: gman:kube_workload_service:info
        expr: |
          group by (source_id, namespace, workload_kind, workload, service_id, environment) (
            topk by (source_id, namespace, workload_kind, workload) (1,
              group by (source_id, namespace, workload_kind, workload, service_id, environment) (
                gman:kube_pod_workload:info
                * on (source_id, namespace, pod) group_left (service_id, environment) gman:kube_pod_service:info))
            or on (source_id, namespace, workload_kind, workload)
            group by (source_id, namespace, workload_kind, workload) (gman:kube_pod_workload:info)
            or on (source_id, namespace, workload_kind, workload)
            label_replace(label_replace(group by (source_id, namespace, deployment) (kube_deployment_metadata_generation),
              "workload", "$1", "deployment", "(.+)"), "workload_kind", "Deployment", "workload", ".*")
            or on (source_id, namespace, workload_kind, workload)
            label_replace(label_replace(group by (source_id, namespace, statefulset) (kube_statefulset_metadata_generation),
              "workload", "$1", "statefulset", "(.+)"), "workload_kind", "StatefulSet", "workload", ".*")
            or on (source_id, namespace, workload_kind, workload)
            label_replace(label_replace(group by (source_id, namespace, daemonset) (kube_daemonset_metadata_generation),
              "workload", "$1", "daemonset", "(.+)"), "workload_kind", "DaemonSet", "workload", ".*")
            or on (source_id, namespace, workload_kind, workload)
            label_replace(label_replace(group by (source_id, namespace, job_name) (kube_job_owner),
              "workload", "$1", "job_name", "(.+)"), "workload_kind", "Job", "workload", ".*"))
      # Desired and available replicas of Deployments, StatefulSets (ready) and DaemonSets (scheduled nodes).
      - record: gman:kube_workload_replicas_desired:max
        expr: |
          max by (source_id, namespace, workload_kind, workload, service_id, environment) (
            (
              label_replace(label_replace(max by (source_id, namespace, deployment) (kube_deployment_spec_replicas),
                "workload", "$1", "deployment", "(.+)"), "workload_kind", "Deployment", "workload", ".*")
              or label_replace(label_replace(max by (source_id, namespace, statefulset) (kube_statefulset_replicas),
                "workload", "$1", "statefulset", "(.+)"), "workload_kind", "StatefulSet", "workload", ".*")
              or label_replace(label_replace(max by (source_id, namespace, daemonset) (kube_daemonset_status_desired_number_scheduled),
                "workload", "$1", "daemonset", "(.+)"), "workload_kind", "DaemonSet", "workload", ".*")
            )
            * on (source_id, namespace, workload_kind, workload) group_left (service_id, environment) gman:kube_workload_service:info)
      - record: gman:kube_workload_replicas_available:max
        expr: |
          max by (source_id, namespace, workload_kind, workload, service_id, environment) (
            (
              label_replace(label_replace(max by (source_id, namespace, deployment) (kube_deployment_status_replicas_available),
                "workload", "$1", "deployment", "(.+)"), "workload_kind", "Deployment", "workload", ".*")
              or label_replace(label_replace(max by (source_id, namespace, statefulset) (kube_statefulset_status_replicas_ready),
                "workload", "$1", "statefulset", "(.+)"), "workload_kind", "StatefulSet", "workload", ".*")
              or label_replace(label_replace(max by (source_id, namespace, daemonset) (kube_daemonset_status_number_available),
                "workload", "$1", "daemonset", "(.+)"), "workload_kind", "DaemonSet", "workload", ".*")
            )
            * on (source_id, namespace, workload_kind, workload) group_left (service_id, environment) gman:kube_workload_service:info)
      # metadata.generation not yet processed by the controller (paused Deployments excluded).
      - record: gman:kube_workload_generation_lag:max
        expr: |
          max by (source_id, namespace, workload_kind, workload, service_id, environment) (
            (
              label_replace(label_replace(
                max by (source_id, namespace, deployment) (kube_deployment_metadata_generation)
                - max by (source_id, namespace, deployment) (kube_deployment_status_observed_generation)
                unless on (source_id, namespace, deployment) (max by (source_id, namespace, deployment) (kube_deployment_spec_paused) == 1),
                "workload", "$1", "deployment", "(.+)"), "workload_kind", "Deployment", "workload", ".*")
              or label_replace(label_replace(
                max by (source_id, namespace, statefulset) (kube_statefulset_metadata_generation)
                - max by (source_id, namespace, statefulset) (kube_statefulset_status_observed_generation),
                "workload", "$1", "statefulset", "(.+)"), "workload_kind", "StatefulSet", "workload", ".*")
              or label_replace(label_replace(
                max by (source_id, namespace, daemonset) (kube_daemonset_metadata_generation)
                - max by (source_id, namespace, daemonset) (kube_daemonset_status_observed_generation),
                "workload", "$1", "daemonset", "(.+)"), "workload_kind", "DaemonSet", "workload", ".*")
            )
            * on (source_id, namespace, workload_kind, workload) group_left (service_id, environment) gman:kube_workload_service:info)
      # Replicas not yet on the current pod template; absent when there are none. StatefulSets: while
      # update_revision differs from current_revision (RollingUpdate and OnDelete). With OnDelete the controller
      # never advances current_revision, so a finished OnDelete rollout is recognized by updated = replicas.
      # DaemonSets: updated_number_scheduled against desired_number_scheduled (both strategies). Deployments
      # report progress themselves (the Progressing condition).
      - record: gman:kube_workload_replicas_outdated:max
        expr: |
          max by (source_id, namespace, workload_kind, workload, service_id, environment) (
            (
              label_replace(label_replace(
                (
                  max by (source_id, namespace, statefulset) (kube_statefulset_replicas)
                  - max by (source_id, namespace, statefulset) (kube_statefulset_status_replicas_updated) > 0
                )
                and on (source_id, namespace, statefulset) (
                  max by (source_id, namespace, statefulset, revision) (kube_statefulset_status_update_revision)
                  unless on (source_id, namespace, statefulset, revision)
                  max by (source_id, namespace, statefulset, revision) (kube_statefulset_status_current_revision)),
                "workload", "$1", "statefulset", "(.+)"), "workload_kind", "StatefulSet", "workload", ".*")
              or label_replace(label_replace(
                max by (source_id, namespace, daemonset) (kube_daemonset_status_desired_number_scheduled)
                - max by (source_id, namespace, daemonset) (kube_daemonset_status_updated_number_scheduled) > 0,
                "workload", "$1", "daemonset", "(.+)"), "workload_kind", "DaemonSet", "workload", ".*")
            )
            * on (source_id, namespace, workload_kind, workload) group_left (service_id, environment) gman:kube_workload_service:info)

      # The cluster sent kube-state-metrics series in the last 6 hours, but none now. Not raised while the
      # gateway itself is down (GManTelemetryGatewayDown).
      - alert: GManKubeStateMetricsAbsent
        expr: |
          max by (source_id) (max_over_time(kube_node_info[6h]))
          unless on (source_id) max by (source_id) (kube_node_info)
          and on () (up{job="otel", exported_job=""} == 1)
        for: 5m
        labels: {severity: warning, scope: pipeline}
        annotations:
          summary: 'Нет метрик kube-state-metrics кластера {{ $labels.source_id }}'
          description: >-
            Алерты workloads этого кластера (реплики, rollout, Pending, Job, DaemonSet) не вычисляются:
            остановлен kube-state-metrics или Collector его узла.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManKubeStateMetricsAbsent'
      - alert: GManWorkloadReplicasUnavailable
        expr: |
          gman:kube_workload_replicas_desired:max - gman:kube_workload_replicas_available:max > 0
        for: 10m
        labels: {severity: warning, scope: workload}
        annotations:
          summary: '{{ $labels.workload_kind }} {{ $labels.namespace }}/{{ $labels.workload }}: недоступно реплик — {{ $value }}'
          description: >-
            Кластер {{ $labels.source_id }}{{ with $labels.service_id }}, сервис {{ . }}{{ end }}: часть реплик
            не готова дольше 10 минут.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManWorkloadReplicasUnavailable'
      - alert: GManWorkloadReplicasUnavailable
        expr: |
          gman:kube_workload_replicas_desired:max > 0
          and gman:kube_workload_replicas_available:max == 0
        for: 5m
        labels: {severity: critical, scope: workload}
        annotations:
          summary: '{{ $labels.workload_kind }} {{ $labels.namespace }}/{{ $labels.workload }}: нет доступных реплик'
          description: >-
            Кластер {{ $labels.source_id }}{{ with $labels.service_id }}, сервис {{ . }}{{ end }}: ни одна из
            {{ $value }} реплик не готова дольше 5 минут.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManWorkloadReplicasUnavailable'
      # progressDeadlineSeconds (10 minutes by default) has already passed when the condition turns false.
      - alert: GManWorkloadRolloutStuck
        expr: |
          max by (source_id, namespace, workload_kind, workload, service_id, environment, reason) (
            label_replace(label_replace(
              max by (source_id, namespace, deployment, reason) (kube_deployment_status_condition{condition="Progressing", status="false"}) == 1,
              "workload", "$1", "deployment", "(.+)"), "workload_kind", "Deployment", "workload", ".*")
            * on (source_id, namespace, workload_kind, workload) group_left (service_id, environment) gman:kube_workload_service:info)
        labels: {severity: warning, scope: workload}
        annotations:
          summary: '{{ $labels.workload_kind }} {{ $labels.namespace }}/{{ $labels.workload }}: rollout не продвигается'
          description: >-
            Кластер {{ $labels.source_id }}{{ with $labels.service_id }}, сервис {{ . }}{{ end }}: условие
            Progressing ложно ({{ $labels.reason }}) — новые pod-ы не стали доступными за progressDeadlineSeconds.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManWorkloadRolloutStuck'
      - alert: GManWorkloadRolloutStuck
        expr: gman:kube_workload_generation_lag:max > 0
        for: 15m
        labels: {severity: warning, scope: workload, reason: GenerationNotObserved}
        annotations:
          summary: '{{ $labels.workload_kind }} {{ $labels.namespace }}/{{ $labels.workload }}: rollout не продвигается'
          description: >-
            Кластер {{ $labels.source_id }}{{ with $labels.service_id }}, сервис {{ . }}{{ end }}: контроллер
            15 минут не обработал изменение спецификации (metadata.generation больше status.observedGeneration).
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManWorkloadRolloutStuck'
      # StatefulSet/DaemonSet rollout without progress: outdated replicas for at least 30 minutes, and their count
      # has not decreased within the last 30 minutes. RollingUpdate stops at a pod that does not become ready
      # (for a DaemonSet — number_unavailable reaches maxUnavailable); OnDelete waits for pods to be deleted.
      # A StatefulSet partition (canary) also keeps replicas outdated on purpose: silence the alert for it.
      - alert: GManWorkloadRolloutStuck
        expr: |
          (
            gman:kube_workload_replicas_outdated:max
            unless gman:kube_workload_replicas_outdated:max < max_over_time(gman:kube_workload_replicas_outdated:max[30m])
          )
          and gman:kube_workload_replicas_outdated:max offset 30m
        for: 5m
        labels: {severity: warning, scope: workload, reason: OutdatedReplicas}
        annotations:
          summary: '{{ $labels.workload_kind }} {{ $labels.namespace }}/{{ $labels.workload }}: rollout не продвигается'
          description: >-
            Кластер {{ $labels.source_id }}{{ with $labels.service_id }}, сервис {{ . }}{{ end }}: {{ $value }}
            pod-ов на прежней версии шаблона, за 30 минут их число не уменьшилось. RollingUpdate остановлен
            неготовым pod-ом; при updateStrategy OnDelete pod-ы обновляются только после удаления.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManWorkloadRolloutStuck'
      # A pod never returns to Pending: created more than 10 minutes ago and Pending now means Pending that long.
      - alert: GManWorkloadPodsPending
        expr: |
          count by (source_id, namespace, workload_kind, workload) (
            gman:kube_pod_workload:info
            and on (source_id, namespace, pod) (max by (source_id, namespace, pod) (kube_pod_status_phase{phase="Pending"}) == 1)
            and on (source_id, namespace, pod) (time() - max by (source_id, namespace, pod) (kube_pod_created) > 600))
          * on (source_id, namespace, workload_kind, workload) group_left (service_id, environment) gman:kube_workload_service:info
        for: 1m
        labels: {severity: warning, scope: workload}
        annotations:
          summary: '{{ $labels.workload_kind }} {{ $labels.namespace }}/{{ $labels.workload }}: pod-ов в Pending — {{ $value }}'
          description: >-
            Кластер {{ $labels.source_id }}{{ with $labels.service_id }}, сервис {{ . }}{{ end }}: pod-ы не запущены
            дольше 10 минут — не хватает ресурсов, taints/affinity, PVC или образ.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManWorkloadPodsPending'
      # Failed condition: backoffLimit or activeDeadlineSeconds exceeded. Stays until the Job is deleted
      # (for CronJob runs — by failedJobsHistoryLimit).
      - alert: GManJobFailed
        expr: |
          max by (source_id, namespace, workload_kind, workload, service_id, environment) (
            label_replace(label_replace(
              max by (source_id, namespace, job_name) (kube_job_failed{condition="true"}) == 1,
              "workload", "$1", "job_name", "(.+)"), "workload_kind", "Job", "workload", ".*")
            * on (source_id, namespace, workload_kind, workload) group_left (service_id, environment) gman:kube_workload_service:info)
        labels: {severity: warning, scope: workload}
        annotations:
          summary: 'Job {{ $labels.namespace }}/{{ $labels.workload }} завершилась ошибкой'
          description: >-
            Кластер {{ $labels.source_id }}{{ with $labels.service_id }}, сервис {{ . }}{{ end }}: исчерпаны
            попытки (backoffLimit) или время (activeDeadlineSeconds).
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManJobFailed'
      - alert: GManDaemonSetMisscheduled
        expr: |
          max by (source_id, namespace, workload_kind, workload, service_id, environment) (
            label_replace(label_replace(
              max by (source_id, namespace, daemonset) (kube_daemonset_status_number_misscheduled) > 0,
              "workload", "$1", "daemonset", "(.+)"), "workload_kind", "DaemonSet", "workload", ".*")
            * on (source_id, namespace, workload_kind, workload) group_left (service_id, environment) gman:kube_workload_service:info)
        for: 15m
        labels: {severity: warning, scope: workload}
        annotations:
          summary: 'DaemonSet {{ $labels.namespace }}/{{ $labels.workload }}: {{ $value }} pod-ов на неподходящих узлах'
          description: >-
            Кластер {{ $labels.source_id }}{{ with $labels.service_id }}, сервис {{ . }}{{ end }}: pod-ы DaemonSet
            работают на узлах, где по nodeSelector/affinity/taints их быть не должно.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManDaemonSetMisscheduled'

  # Releases (backend/src/releases): gman_release_status has one series per service/environment for its
  # latest release. The alert stays while that release is failed and resolves with the next release.
  - name: gman-releases
    rules:
      - alert: GManReleaseFailed
        expr: max by (service_id, environment) (gman_release_status{status="failed"}) == 1
        labels: {severity: warning, scope: release}
        annotations:
          summary: 'Релиз {{ $labels.service_id }} в {{ $labels.environment }} завершился ошибкой'
          description: >-
            Последний релиз (начат {{ with printf "gman_release_started_timestamp_seconds{service_id='%s',environment='%s'}" $labels.service_id $labels.environment | query }}{{ . | first | value | humanizeTimestamp }}{{ end }})
            в статусе failed: ошибка в Bamboo, сбой новых экземпляров или тайм-аут выката. Причина — на вкладке «Релизы» сервиса.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManReleaseFailed'

  # TLS files of nginx (backend/src/exposition, GMAN_TLS_WATCH_FILES): one series per watched file (and per
  # certificate of a bundle). nginx verifies OTLP client certificates against crl.pem: past its nextUpdate every
  # client is rejected and telemetry stops from all servers, so the CRL has its own alerts.
  - name: gman-tls
    rules:
      - alert: GManTlsCrlExpiring
        expr: (gman_tls_crl_next_update_timestamp_seconds - time() < 30 * 86400) > 0
        labels: {severity: warning, scope: tls}
        annotations:
          summary: 'Список отзыва {{ $labels.file }} истекает через {{ $value | humanizeDuration }}'
          description: >-
            nextUpdate CRL ({{ $labels.issuer }}) через {{ $value | humanizeDuration }}. После этого nginx отвергнет
            все клиентские сертификаты OTLP и телеметрия всех серверов остановится. Переподписать: issue.sh crl.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManTlsCrlExpiring'
      - alert: GManTlsCrlExpiring
        expr: (gman_tls_crl_next_update_timestamp_seconds - time() < 7 * 86400) > 0
        labels: {severity: critical, scope: tls}
        annotations:
          summary: 'Список отзыва {{ $labels.file }} истекает через {{ $value | humanizeDuration }}'
          description: >-
            nextUpdate CRL ({{ $labels.issuer }}) через {{ $value | humanizeDuration }}. После этого nginx отвергнет
            все клиентские сертификаты OTLP и телеметрия всех серверов остановится. Переподписать: issue.sh crl.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManTlsCrlExpiring'
      - alert: GManTlsCrlExpired
        expr: time() - gman_tls_crl_next_update_timestamp_seconds >= 0
        labels: {severity: critical, scope: tls}
        annotations:
          summary: 'Список отзыва {{ $labels.file }} просрочен'
          description: >-
            nextUpdate CRL ({{ $labels.issuer }}) прошел {{ $value | humanizeDuration }} назад: nginx отвергает все
            клиентские сертификаты OTLP, телеметрия серверов не принимается.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManTlsCrlExpired'
      - alert: GManTlsCertExpiring
        expr: (gman_tls_cert_not_after_timestamp_seconds - time() < 30 * 86400) > 0
        labels: {severity: warning, scope: tls}
        annotations:
          summary: 'Сертификат {{ $labels.subject }} истекает через {{ $value | humanizeDuration }}'
          description: 'Файл {{ $labels.file }}: notAfter через {{ $value | humanizeDuration }}. Перевыпустить и заменить на сервере.'
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManTlsCertExpiring'
      - alert: GManTlsCertExpiring
        expr: (gman_tls_cert_not_after_timestamp_seconds - time() < 7 * 86400) > 0
        labels: {severity: critical, scope: tls}
        annotations:
          summary: 'Сертификат {{ $labels.subject }} истекает через {{ $value | humanizeDuration }}'
          description: 'Файл {{ $labels.file }}: notAfter через {{ $value | humanizeDuration }}. Перевыпустить и заменить на сервере.'
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManTlsCertExpiring'
      - alert: GManTlsCertExpired
        expr: time() - gman_tls_cert_not_after_timestamp_seconds >= 0
        labels: {severity: critical, scope: tls}
        annotations:
          summary: 'Сертификат {{ $labels.subject }} просрочен'
          description: >-
            Файл {{ $labels.file }}: notAfter прошел {{ $value | humanizeDuration }} назад. Клиенты не доверяют
            порталу или OTLP endpoint (серверный сертификат) либо любому сертификату пилотного CA (CA).
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManTlsCertExpired'
      # Without the file the expiry alerts above cannot fire for it.
      - alert: GManTlsFileError
        expr: gman_tls_file_error == 1
        for: 5m
        labels: {severity: warning, scope: tls}
        annotations:
          summary: 'API не может прочитать {{ $labels.file }}'
          description: >-
            Файл из GMAN_TLS_WATCH_FILES отсутствует, не читается пользователем API (65534), не разбирается как
            сертификат/CRL или похож на ключ. Сроки действия этого файла не контролируются.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManTlsFileError'

  # Kubernetes node Events (kubelet, node lifecycle controller, node-problem-detector) collected by the inventory
  # agent: gman_k8s_node_event_last_timestamp_seconds is the time of the latest Event per node and reason, so an
  # alert lasts a fixed window after the Event. Pressure comes from the node condition in the snapshot instead
  # (resolves when the condition clears). scope=node: GManK8sNodeNotReady of the same host_id inhibits these alerts,
  # GManSourceSilent of the cluster inhibits them too (deploy/alerts/alertmanager.yaml).
  - name: gman-node-events
    rules:
      - alert: GManK8sNodeOOM
        expr: |
          max by (source_id, host_id, reason) (
            time() - gman_k8s_node_event_last_timestamp_seconds{reason=~"OOMKilling|SystemOOM"}
          ) < 1800
        labels: {severity: warning, scope: node}
        annotations:
          summary: 'OOM на узле {{ $labels.host_id }} ({{ $labels.reason }})'
          description: >-
            {{ $value | humanizeDuration }} назад ядро узла {{ $labels.host_id }} (кластер {{ $labels.source_id }})
            завершило процесс по нехватке памяти. SystemOOM — закончилась память всего узла (kubelet);
            OOMKilling — сообщение node-problem-detector. Затронутый pod, если агент его определил, — в «Аудите».
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManK8sNodeOOM'
      - alert: GManK8sNodePressure
        expr: max by (source_id, host_id, condition) (gman_k8s_node_pressure{condition=~"MemoryPressure|DiskPressure|PIDPressure"}) == 1
        for: 2m
        labels: {severity: warning, scope: node}
        annotations:
          summary: 'Узел {{ $labels.host_id }}: {{ $labels.condition }}'
          description: >-
            Условие {{ $labels.condition }} узла {{ $labels.host_id }} (кластер {{ $labels.source_id }}) истинно:
            kubelet вытесняет pod-ы и не принимает новые с этим ресурсом.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManK8sNodePressure'
      - alert: GManK8sNodeEviction
        expr: |
          max by (source_id, host_id) (
            time() - gman_k8s_node_event_last_timestamp_seconds{reason="EvictionThresholdMet"}
          ) < 900
        labels: {severity: warning, scope: node}
        annotations:
          summary: 'Узел {{ $labels.host_id }} освобождает ресурсы (EvictionThresholdMet)'
          description: >-
            {{ $value | humanizeDuration }} назад kubelet узла {{ $labels.host_id }} (кластер {{ $labels.source_id }})
            достиг порога вытеснения: pod-ы узла могут быть вытеснены (Evicted).
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManK8sNodeEviction'
      - alert: GManK8sNodeKernelProblem
        expr: |
          max by (source_id, host_id, reason) (
            time() - gman_k8s_node_event_last_timestamp_seconds{reason=~"KernelOops|TaskHung|FilesystemIsReadOnly"}
          ) < 3600
        labels: {severity: warning, scope: node}
        annotations:
          summary: 'Проблема ядра на узле {{ $labels.host_id }}: {{ $labels.reason }}'
          description: >-
            node-problem-detector сообщил {{ $labels.reason }} {{ $value | humanizeDuration }} назад
            (кластер {{ $labels.source_id }}).
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManK8sNodeKernelProblem'
      - alert: GManK8sNodeRebooted
        expr: |
          max by (source_id, host_id) (
            time() - gman_k8s_node_event_last_timestamp_seconds{reason="Rebooted"}
          ) < 900
        labels: {severity: warning, scope: node}
        annotations:
          summary: 'Узел {{ $labels.host_id }} перезагрузился'
          description: >-
            kubelet сообщил о перезагрузке узла {{ $labels.host_id }} (кластер {{ $labels.source_id }})
            {{ $value | humanizeDuration }} назад; pod-ы узла перезапущены.
          runbook_url: '{{ $externalLabels.gman_portal }}/#alerts/GManK8sNodeRebooted'
