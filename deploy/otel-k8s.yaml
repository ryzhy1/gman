# Node Collector for the Kubernetes cluster: one pod per node (DaemonSet).
# Before applying: create Secret gman-otel-tls (ca.pem, client.pem, client-key.pem) in
# namespace gman-otel and set OTEL_GATEWAY and K8S_CLUSTER_NAME below. The client certificate is
# `deploy/pki/issue.sh cluster <K8S_CLUSTER_NAME>`: the gateway sets k8s.cluster.name from its CN.
# host.id is the node name: GMan joins node metrics with nodes from the inventory agent.
# kube-state-metrics (deploy/kube-state-metrics.yaml) is scraped by the Collector of its node.
# Persistent sending queue: hostPath /var/lib/gman-otel on every node (created by the init container, owned by
# the Collector's uid 10001), so unsent batches survive a pod restart, a DaemonSet rollout and a node reboot.
apiVersion: v1
kind: Namespace
metadata:
  name: gman-otel
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gman-otel
  namespace: gman-otel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gman-otel
rules:
  # kubelet_stats reads the kubelet summary API (nodes/stats) and pod specs (nodes/proxy, /pods) of its own node.
  - apiGroups: ['']
    resources: ['nodes/stats', 'nodes/proxy']
    verbs: ['get']
  # k8s_attributes, DCGM and kube-state-metrics discovery: metadata only, no Secrets, no exec.
  - apiGroups: ['']
    resources: ['pods', 'namespaces', 'nodes']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apps']
    resources: ['replicasets']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gman-otel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gman-otel
subjects:
  - kind: ServiceAccount
    name: gman-otel
    namespace: gman-otel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gman-otel
  namespace: gman-otel
data:
  config.yaml: |
    receivers:
      host_metrics:
        root_path: /hostfs
        collection_interval: 15s
        scrapers:
          cpu:
            metrics:
              system.cpu.utilization: {enabled: true}
          memory:
            metrics:
              system.memory.utilization: {enabled: true}
          load: {}
          disk: {}
          filesystem:
            exclude_fs_types:
              fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs,
                         mqueue, nsfs, overlay, proc, procfs, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs,
                         sysfs, tracefs, tmpfs]
              match_type: strict
            metrics:
              system.filesystem.utilization: {enabled: true}
          network: {}
          paging: {}
      kubelet_stats:
        collection_interval: 15s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        # The kubelet serving certificate is usually self-signed per node.
        insecure_skip_verify: true
        metric_groups: [node, pod, container]
        # Limit/request utilization needs pod specs from the kubelet /pods endpoint (nodes/proxy).
        metrics:
          k8s.container.cpu_limit_utilization: {enabled: true}
          k8s.container.cpu_request_utilization: {enabled: true}
          k8s.container.memory_limit_utilization: {enabled: true}
          k8s.container.memory_request_utilization: {enabled: true}
          k8s.pod.cpu_limit_utilization: {enabled: true}
          k8s.pod.memory_limit_utilization: {enabled: true}
          container.uptime: {enabled: true}
          k8s.pod.uptime: {enabled: true}
      # NVIDIA DCGM Exporter of this node, as deployed by the GPU Operator. In its Kubernetes mode (operator
      # default) series of GPUs allocated by the device plugin carry namespace/pod/container labels; they are
      # kept as is and give the portal per-pod GPU (metrics scope k8s_gpu).
      prometheus/gpu:
        config:
          scrape_configs:
            - job_name: dcgm
              scrape_interval: 15s
              kubernetes_sd_configs:
                - role: pod
                  selectors:
                    - role: pod
                      field: spec.nodeName=${env:K8S_NODE_NAME}
                      label: app=nvidia-dcgm-exporter
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  regex: '9400'
                  action: keep
      # Model server pods of this node (README, «Метрики LLM», «Метрики Triton»): annotations gman.io/metrics: vllm|triton
      # and gman.io/metrics-port: "<container port of /metrics: vLLM's OpenAI API port, Triton's 8002>"; label gman.service
      # binds them to the catalog. One job per server kind: exported_job tells them apart.
      prometheus/llm:
        config:
          scrape_configs:
            - job_name: vllm
              scrape_interval: 15s
              kubernetes_sd_configs:
                - role: pod
                  selectors:
                    - role: pod
                      field: spec.nodeName=${env:K8S_NODE_NAME}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_gman_io_metrics]
                  regex: vllm
                  action: keep
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: Running
                  action: keep
                - source_labels: [__meta_kubernetes_pod_annotation_gman_io_metrics_port]
                  regex: '\d+'
                  action: keep
                # One target per pod (pod SD yields one per container port; equal targets are merged).
                # $$ is a literal $ (regex group): the Collector expands $ as environment variables.
                - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_gman_io_metrics_port]
                  regex: '(.+);(\d+)'
                  target_label: __address__
                  replacement: '$$1:$$2'
                  action: replace
                - source_labels: [__meta_kubernetes_pod_label_gman_service]
                  target_label: gman_service
                - source_labels: [__meta_kubernetes_pod_label_gman_environment]
                  target_label: gman_environment
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
            - job_name: triton
              scrape_interval: 15s
              kubernetes_sd_configs:
                - role: pod
                  selectors:
                    - role: pod
                      field: spec.nodeName=${env:K8S_NODE_NAME}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_gman_io_metrics]
                  regex: triton
                  action: keep
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: Running
                  action: keep
                - source_labels: [__meta_kubernetes_pod_annotation_gman_io_metrics_port]
                  regex: '\d+'
                  action: keep
                # One target per pod (pod SD yields one per container port; equal targets are merged).
                # $$ is a literal $ (regex group): the Collector expands $ as environment variables.
                - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_gman_io_metrics_port]
                  regex: '(.+);(\d+)'
                  target_label: __address__
                  replacement: '$$1:$$2'
                  action: replace
                - source_labels: [__meta_kubernetes_pod_label_gman_service]
                  target_label: gman_service
                - source_labels: [__meta_kubernetes_pod_label_gman_environment]
                  target_label: gman_environment
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
      # kube-state-metrics (deploy/kube-state-metrics.yaml): only the Collector of the node running its pod
      # scrapes it, so every series arrives once. Cluster-level series: separate pipeline metrics/ksm below.
      prometheus/ksm:
        config:
          scrape_configs:
            - job_name: kube-state-metrics
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: {names: [gman-otel]}
                  selectors:
                    - role: pod
                      field: spec.nodeName=${env:K8S_NODE_NAME}
                      label: app.kubernetes.io/name=kube-state-metrics
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  regex: http-metrics
                  action: keep
    extensions:
      # Persistent sending queue on the node (volume queue below): README, «Очередь Collector на диске».
      file_storage:
        directory: /var/lib/gman-otel
        compaction:
          on_start: true
          on_rebound: true
          # Defaults to /var/lib/otelcol/file_storage, which does not exist in the read-only root filesystem.
          directory: /var/lib/gman-otel
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 96
      # Pod labels become metric labels so dashboards and GMan can filter by service.
      k8s_attributes:
        auth_type: serviceAccount
        # Hold the pipeline until the pod cache is synced: otherwise the first minutes of metrics
        # after a restart carry no gman_service/gman_environment labels.
        wait_for_metadata: true
        wait_for_metadata_timeout: 30s
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.node.name]
          labels:
            - tag_name: gman_service
              key: gman.service
              from: pod
            - tag_name: gman_environment
              key: gman.environment
              from: pod
        pod_association:
          - sources: [{from: resource_attribute, name: k8s.pod.uid}]
      resource:
        attributes:
          - key: host.id
            value: ${env:K8S_NODE_NAME}
            action: upsert
          - key: k8s.cluster.name
            value: ${env:K8S_CLUSTER_NAME}
            action: upsert
      # kube-state-metrics describes the whole cluster, not the node that scrapes it: no host.id
      # (GManNodeDown/NotReady of that node must not inhibit workload alerts) and no k8s_attributes.
      # Prometheus copies k8s.cluster.name into source_id (deploy/prometheus.yaml).
      resource/ksm:
        attributes:
          - key: k8s.cluster.name
            value: ${env:K8S_CLUSTER_NAME}
            action: upsert
      batch: {}
    exporters:
      otlp_grpc:
        endpoint: ${env:OTEL_GATEWAY}
        tls:
          ca_file: /etc/gman/ca.pem
          cert_file: /etc/gman/client.pem
          key_file: /etc/gman/client-key.pem
        # Queue on disk, capped by size of the serialized data; when full, new batches are dropped.
        sending_queue:
          storage: file_storage
          sizer: bytes
          queue_size: 268435456
        # Retry until the gateway is back (the default drops a batch after 5 minutes).
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 60s
          max_elapsed_time: 0
    service:
      extensions: [file_storage]
      pipelines:
        metrics:
          receivers: [host_metrics, kubelet_stats, prometheus/gpu, prometheus/llm]
          processors: [memory_limiter, k8s_attributes, resource, batch]
          exporters: [otlp_grpc]
        metrics/ksm:
          receivers: [prometheus/ksm]
          processors: [memory_limiter, resource/ksm, batch]
          exporters: [otlp_grpc]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gman-otel
  namespace: gman-otel
spec:
  selector:
    matchLabels: {app: gman-otel}
  template:
    metadata:
      labels: {app: gman-otel}
    spec:
      serviceAccountName: gman-otel
      # host_metrics reads network counters of its own network namespace: use the node's one.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Run on GPU and control-plane nodes too.
      tolerations: [{operator: Exists}]
      # hostPath DirectoryOrCreate creates the queue directory as root:root 0755; the Collector runs as 10001.
      initContainers:
        - name: queue-dir
          image: busybox:1.37
          command: ['sh', '-c', 'chown 10001:10001 /var/lib/gman-otel && chmod 0700 /var/lib/gman-otel']
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [CHOWN, FOWNER]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          volumeMounts:
            - {name: queue, mountPath: /var/lib/gman-otel}
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.162.0
          args: ['--config=/etc/otelcol/config.yaml']
          env:
            - name: K8S_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: K8S_NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: K8S_CLUSTER_NAME
              value: cluster-01  # Same as the inventory agent's --source-id.
            - name: OTEL_GATEWAY
              value: gman-gateway.example:4317  # Replace with the central gateway address.
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol}
            - {name: tls, mountPath: /etc/gman, readOnly: true}
            - {name: hostfs, mountPath: /hostfs, readOnly: true, mountPropagation: HostToContainer}
            - {name: queue, mountPath: /var/lib/gman-otel}
      volumes:
        - name: config
          configMap: {name: gman-otel}
        - name: tls
          secret: {secretName: gman-otel-tls}
        - name: hostfs
          hostPath: {path: /}
        - name: queue
          hostPath: {path: /var/lib/gman-otel, type: DirectoryOrCreate}
