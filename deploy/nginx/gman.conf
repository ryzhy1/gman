# Production portal/API ingress. Mounted by deploy/compose.prod.yaml over the image's
# /etc/nginx/conf.d/default.conf (included in the http context).
# TLS files come from deploy/pki/issue.sh server portal ... or a corporate CA.

# Per-client request rates. Agents send once a minute; Bamboo once per deploy step.
limit_req_zone $binary_remote_addr zone=gman_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=gman_ingest:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=gman_grafana:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=gman_conn:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# OTLP client certificate identity (deploy/pki/issue.sh): subject /O=GMan pilot/OU=client|cluster/CN=<id>,
# in RFC 2253 order as nginx prints it. Any other subject maps to "" and the gateway drops its data.
# With a corporate CA, adapt these patterns to its subject format.
map $ssl_client_s_dn $gman_otlp_host {
    "~^CN=([A-Za-z0-9][A-Za-z0-9._-]*),OU=client,O=GMan pilot$" $1;
    default "";
}
map $ssl_client_s_dn $gman_otlp_cluster {
    "~^CN=([A-Za-z0-9][A-Za-z0-9._-]*),OU=cluster,O=GMan pilot$" $1;
    default "";
}

server {
    listen 80 default_server;
    server_tokens off;
    # Container healthcheck; plain HTTP otherwise only redirects.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/portal.pem;
    ssl_certificate_key /etc/nginx/tls/portal-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:gman_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    limit_conn gman_conn 64;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    # Inventory snapshots of a large cluster can be several MB; everything else is small.
    location = /api/inventory {
        client_max_body_size 20m;
        limit_req zone=gman_ingest burst=10 nodelay;
        proxy_pass http://api:8000;
    }
    location /api/ {
        limit_req zone=gman_api burst=40 nodelay;
        proxy_pass http://api:8000;
    }
    # Grafana is served from a sub path (GF_SERVER_SERVE_FROM_SUB_PATH) and sets its own
    # CSP-compatible headers; the portal's strict CSP would break its inline scripts.
    location /grafana/ {
        limit_req zone=gman_grafana burst=100 nodelay;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        # proxy_set_header here replaces the server-level list, so repeat it (Grafana Live).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://grafana:3000;
    }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        limit_req zone=gman_api burst=40 nodelay;
        try_files $uri /index.html;
    }
}

# OTLP gRPC from node Collectors (published 4317). nginx terminates mutual TLS: only certificates of the
# pilot CA that are not in crl.pem pass (deploy/pki/issue.sh revoke / crl; reload nginx after replacing
# crl.pem, and re-sign it before nextUpdate: an expired CRL rejects every client). The gateway (otel:4317,
# internal) receives the certificate identity as metadata and binds host.id / k8s.cluster.name to it
# (deploy/otel-gateway.prod.yaml). grpc_set_header replaces client-sent headers of the same name, and an
# empty value is not passed at all.
server {
    listen 4317 ssl;
    http2 on;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/gateway.pem;
    ssl_certificate_key /etc/nginx/tls/gateway-key.pem;
    ssl_client_certificate /etc/nginx/tls/ca.pem;
    ssl_crl /etc/nginx/tls/crl.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:gman_otlp_tls:1m;
    ssl_session_tickets off;

    # Matches the gateway's max_recv_msg_size_mib.
    client_max_body_size 16m;
    client_body_timeout 30s;
    limit_conn gman_conn 64;

    location / {
        grpc_set_header x-gman-otlp-host $gman_otlp_host;
        grpc_set_header x-gman-otlp-cluster $gman_otlp_cluster;
        grpc_pass grpc://otel:4317;
    }
}
